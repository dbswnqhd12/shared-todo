<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>IST Today · GWJ3 IB</title>
<link rel="icon" type="image/png" href="/icons/favicon-64.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EEF1F5;--paper:#FFFFFF;--ink:#18202C;--muted:#5E6776;--line:#D5DBE4;--accent:#2557A7;--accent-soft:#DDE6F4;--high:#B4452F;--high-soft:#F6E1DB}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10141B;--paper:#171D27;--ink:#E6EAF0;--muted:#939DAD;--line:#29313F;--accent:#7FA9EE;--accent-soft:#1C2A42;--high:#F08A73;--high-soft:#3A2420}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:0 16px}
main{max-width:640px;margin:0 auto;padding:24px 0 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px}
.top a,.top button{color:var(--accent);font:inherit;font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-decoration:none}
.td-head h2{font-size:24px!important}
#lock{max-width:360px;margin:80px auto;background:var(--paper);border-radius:14px;padding:22px}
#lock input{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin:10px 0}
#lock button{width:100%;font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px}
.err{color:var(--high);font-size:13px}
</style><script src="/today.js"></script></head><body>
<div id="lock" hidden><b>팀 비밀번호를 입력하세요</b><input id="pw" type="password" autocomplete="current-password"><button id="go">열기</button><p class="err" id="lockErr"></p></div>
<main id="app" hidden>
  <div class="top"><a href="/">← 사이트로</a><span><button id="re">지금 데이터로 다시 만들기</button> · <a href="/report.html">월 결산</a></span></div>
  <p class="err" id="err"></p>
  <div id="box"></div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const ls = { get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set(k,v){ try { localStorage.setItem(k, v); } catch {} } };
  let key = ls.get('team-key'), snap = null;
  const get = async url => {
    const r = await fetch(url, { headers: key ? { 'x-team-key': encodeURIComponent(key) } : {}, cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401 || d.locked) { const e = new Error(d.error || ''); e.locked = true; throw e; }
    if (!r.ok) throw new Error(d.error || '불러오지 못했어요.');
    return d;
  };
  // 줄을 누르면 사이트의 해당 IST 탭으로
  const open = t => { ls.set('todo-view2', t); ls.set('ist-sub', t); location.href = '/'; };
  async function load(rebuild) {
    $('err').textContent = '';
    try {
      const [s, r, o, x] = await Promise.all([get('/api/report?today=1' + (rebuild ? '&rebuild=1' : '')), get('/api/returns'), get('/api/overs'), get('/api/outs')]);
      snap = s;
      $('lock').hidden = true; $('app').hidden = false;
      IstToday.render($('box'), snap, { ret: r.items, over: o.items, out: x.items }, { onOpen: open });
    } catch (e) {
      if (e.locked) { $('app').hidden = true; $('lock').hidden = false; $('lockErr').textContent = key ? e.message : ''; return; }
      $('app').hidden = false; $('err').textContent = e.message;
    }
  }
  $('re').onclick = () => load(true);
  $('go').onclick = () => { key = $('pw').value; ls.set('team-key', key); load(); };
  $('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden && snap) load(); });
  setInterval(() => { if (!document.hidden && snap) load(); }, 120000);
  load();
})();
</script>
</body></html>
