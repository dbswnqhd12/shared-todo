<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>GWJ3 IB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF2F1; --paper:#FFFFFF; --ink:#18231F; --muted:#5E6B66; --line:#D5DDDA;
  --accent:#1F6F5C; --accent-soft:#DCEDE7; --high:#B4452F; --high-soft:#F6E1DB;
  --ch-shade:rgba(40,50,60,.09); --ch-line:#9FB3AB;
  --mid:#9A6A12; --mid-soft:#F4EAD2; --focus:#1F6F5C; --sat:#2F5F9E; --sat-soft:#E1E7F3; --vio:#6A4FB0; --vio-soft:#ECE6F7;
  --day:#9A6A12; --day-soft:#F4EAD2; --eve:#B0562F; --eve-soft:#F7E4DA; --night:#34508A; --night-soft:#E1E7F3;
  --display:"Gowun Batang",Georgia,serif;
  --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111816; --paper:#18211E; --ink:#E6EDEA; --muted:#93A29C; --line:#2A3632;
    --accent:#5CC4A6; --accent-soft:#1D3530; --high:#F08A73; --high-soft:#3A2420;
    --ch-shade:rgba(255,255,255,.06); --ch-line:#4A5E57;
    --mid:#E0B45A; --mid-soft:#352C1A; --focus:#5CC4A6; --sat:#86AEE6; --sat-soft:#1E2638; --vio:#B9A5F0; --vio-soft:#2A2340;
    --day:#E0B45A; --day-soft:#352C1A; --eve:#EE9A74; --eve-soft:#3A261C; --night:#93AEE8; --night-soft:#1E2638;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111816; --paper:#18211E; --ink:#E6EDEA; --muted:#93A29C; --line:#2A3632;
  --accent:#5CC4A6; --accent-soft:#1D3530; --high:#F08A73; --high-soft:#3A2420;
  --ch-shade:rgba(255,255,255,.06); --ch-line:#4A5E57;
  --mid:#E0B45A; --mid-soft:#352C1A; --focus:#5CC4A6; --sat:#86AEE6; --sat-soft:#1E2638; --vio:#B9A5F0; --vio-soft:#2A2340;
  --day:#E0B45A; --day-soft:#352C1A; --eve:#EE9A74; --eve-soft:#3A261C; --night:#93AEE8; --night-soft:#1E2638;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px}
.wrap.wide{max-width:1080px}
.wrap{max-width:760px;margin:0 auto;padding-block:40px 64px;display:flex;flex-direction:column;gap:20px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:"Big Shoulders Display",var(--display);font-weight:800;font-size:clamp(34px,7vw,46px);letter-spacing:.02em;line-height:1.05;margin:0;text-wrap:balance}
h2,h3{margin:0}
.date{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.progress{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:140px}
.progress-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.bar{width:140px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{background:var(--accent);color:var(--paper);border:0;border-radius:6px;padding:7px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.ghost{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:5px 12px;font-size:13px}
.ghost:hover{border-color:var(--accent)}
.ghost[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:4px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.sync.err i{background:var(--high)}
.sync.busy i{background:var(--mid)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:5}

/* 잠금 화면 */
.lock{max-width:360px;margin:12vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.lock h2{font-family:var(--display);font-size:24px}
.lock p{margin:0;color:var(--muted);font-size:14px}
.lock form{display:flex;gap:8px}
.lock input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:8px 10px}
.lock .err{color:var(--high);font-size:13px;min-height:1.2em}

/* 할 일 입력 */
form.add{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px}
form.add input[type=text]{flex:1 1 220px;min-width:0;border:0;background:transparent;color:var(--ink);padding:8px 6px;outline:none}
form.add input[type=text]::placeholder{color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
select,input[type=date]{font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

.tabs,.seg{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px}
.tabs button,.seg button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:5px;font-size:13px}
.tabs button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg{align-self:flex-start}
.seg button{padding:6px 16px;font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.link:hover{color:var(--high)}

/* 달력 */
.cal{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal-title{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.cal-nav{display:flex;gap:6px}
.cal-nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:13px}
.cal-nav button:hover{border-color:var(--accent)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0 4px}
.dow.sun{color:var(--high)} .dow.sat{color:var(--sat)}
.day{min-height:100px;min-width:0;border:1px solid transparent;border-radius:6px;background:var(--bg);padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);overflow:hidden}
.day:hover{border-color:var(--line)}
.day.out{opacity:.42}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day-top{display:flex;justify-content:space-between;align-items:center;gap:2px}
.num{font-family:var(--mono);font-size:12px;line-height:20px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.day.sun .num{color:var(--high)} .day.sat .num{color:var(--sat)}
.day.today .num{background:var(--accent);color:var(--paper);border-radius:999px;padding:0 5px;font-weight:500}
.ck{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ck.full{color:var(--accent);font-weight:500}
.ck.part{color:var(--mid)}
.ev{font-size:11.5px;line-height:1.35;padding:2px 5px;border-radius:4px;background:var(--mid-soft);color:var(--ink);white-space:normal;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ev.high{background:var(--high-soft)} .ev.low{background:var(--accent-soft)}
.ev.done{background:transparent;color:var(--muted);text-decoration:line-through;padding-block:0}
.ev.late{color:var(--high);font-weight:600}
.more{font-size:11px;font-weight:600;color:var(--accent);padding-left:5px}
.tcount{display:none;font-size:10px;font-weight:600;line-height:16px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--mid-soft);color:var(--mid);text-align:center;font-variant-numeric:tabular-nums}
.tcount.high{background:var(--high-soft);color:var(--high)} .tcount.done{background:var(--line);color:var(--muted)}

/* 날짜 패널 */
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead h2{font-size:18px}
.dayhead .sub{font-size:13px;color:var(--muted)}
.section-label{font-size:14px;font-weight:600;color:var(--ink);margin:6px 0 -8px}
.shifts{display:grid;grid-template-columns:1fr;gap:8px}
.shift{background:var(--paper);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.shift-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.shift-name{font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.shift-name::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.shift-count{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.shift-count.full{color:var(--accent);font-weight:500}
.shift-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.shift-bar i{display:block;height:100%;background:var(--c);transition:width .3s}
.shift.s-day{--c:var(--day);--cs:var(--day-soft)} .shift.s-eve{--c:var(--eve);--cs:var(--eve-soft)} .shift.s-night{--c:var(--night);--cs:var(--night-soft)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.checks li{display:flex;align-items:flex-start;gap:6px;border-radius:6px;padding:5px 4px}
.checks li:hover{background:var(--bg)}
.checks label{display:flex;align-items:flex-start;gap:8px;cursor:pointer;flex:1;min-width:0;font-size:14px;line-height:1.45}
.checks input[type=checkbox]{appearance:none;flex:none;width:18px;height:18px;margin:1px 0 0;border:2px solid var(--line);border-radius:5px;background:var(--paper);display:grid;place-items:center;cursor:pointer}
.checks input[type=checkbox]:checked{background:var(--c);border-color:var(--c)}
.checks input[type=checkbox]:checked::after{content:"✓";color:var(--paper);font-size:12px;line-height:1;font-weight:700}
.checks .t{overflow-wrap:anywhere}
.shift-body .checks li{padding:8px 6px;gap:8px}
.shift-body .checks label{font-size:14.5px;line-height:1.5;gap:10px}
.shift-body .checks input[type=checkbox]{width:20px;height:20px;margin-top:1px}
.checks .t .dot{font-style:normal;color:var(--muted);margin:0 5px;font-weight:700}
.checks .t .note{display:block;font-size:12px;color:var(--muted);line-height:1.4;margin-top:1px}
.checks-sub{margin:6px 0 0;padding:8px 6px 4px;border-top:1px dashed var(--line);font-size:12px;font-weight:700;color:var(--c);letter-spacing:.02em}
.checks li.on .t{color:var(--muted);text-decoration:line-through}
.checks li.on .t{text-decoration:none}.checks li.on .t .m{text-decoration:line-through}
.checks .at{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto;padding-left:4px;white-space:nowrap}
.checks .rm{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:2px 6px;border-radius:5px}
.checks .rm:hover{color:var(--high);background:var(--high-soft)}
.shift-empty{font-size:13px;color:var(--muted);margin:0;padding:4px}
.shift-add{display:flex;gap:6px}
.shift-add input{flex:1;min-width:0;font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px}
.shift-add button{border:0;background:var(--cs);color:var(--c);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600}
.edit-note{font-size:12.5px;color:var(--muted);margin:-10px 0 0}
.ho{display:flex;flex-direction:column;gap:14px}
.ho-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ho-date-label{font-size:14px;font-weight:600;color:var(--muted)}
.ho-date{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:16px;font-weight:600;font-family:inherit}
.ho-date:focus{border-color:var(--accent)}
.ho-date-txt{font-size:14px;color:var(--muted)}
.ho-shot{margin-left:auto;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600}
.ho-shot:hover{background:var(--accent);color:#fff}
.ho-shot-view{position:fixed;inset:0;z-index:50;background:rgba(15,20,18,.92);display:flex;flex-direction:column;gap:10px;padding:14px;overflow:auto}
.ho-shot-bar{display:flex;gap:8px}
.ho-shot-save{flex:1;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px;font-size:16px;font-weight:700}
.ho-shot-close{border:1px solid #fff5;background:none;color:#fff;border-radius:8px;padding:12px 16px;font-size:15px}
.ho-shot-tip{margin:0;color:#e6ece9;font-size:13px;line-height:1.5}
.ho-shot-view img{width:100%;height:auto;background:#fff;border-radius:6px;-webkit-touch-callout:default}
.ho-sec{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ho-sec-head h3{font-size:16px}
.ho-sec-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ho-in{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:7px 9px;font-size:14px;line-height:1.45;resize:vertical}
.ho-in:focus{border-color:var(--accent);background:var(--paper)}
.ho-del{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:7px 8px;border-radius:5px;white-space:nowrap}
.ho-del:hover{color:var(--high);background:var(--high-soft)}
.ho-del.armed{color:#fff;background:var(--high);font-size:12.5px;font-weight:600}
.ho-add{align-self:flex-start;border:1px dashed var(--line);background:none;color:var(--accent);border-radius:6px;padding:6px 12px;font-size:13.5px;font-weight:600}
.ho-add:hover{border-color:var(--accent)}
.ho-table-wrap{overflow-x:auto}
.ho-table{border-collapse:collapse;min-width:620px;width:100%;font-size:13px}
.ho-table th,.ho-table td{border:1px solid var(--line);padding:2px;text-align:center;vertical-align:middle}
.ho-table thead th{background:var(--bg);font-weight:600;padding:6px 4px;white-space:nowrap}
.ho-table .ho-gm th{font-size:12px;color:var(--muted);padding:3px 4px}
.ho-table tbody th{background:var(--bg);font-weight:600;white-space:nowrap;padding:4px 8px;text-align:left;position:sticky;left:0;z-index:1}
.ho-num{width:100%;min-width:2.6em;border:0;border-radius:4px;background:transparent;color:var(--ink);text-align:center;font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;padding:7px 2px}
.ho-num:focus{background:var(--accent-soft)}
.ho-total td{font-family:var(--mono);font-weight:600;color:var(--accent);background:var(--accent-soft);padding:6px 2px;font-variant-numeric:tabular-nums}
.ho-cellnote{width:100%;min-width:3.6em;border:0;border-radius:4px;background:transparent;color:var(--ink);font-size:12px;line-height:1.35;resize:none;overflow:hidden;padding:4px}
.ho-cellnote:focus{background:var(--accent-soft)}
.ho-car-skip{font-size:12px;color:var(--muted);background:var(--bg)}
.ho-carno{font-family:var(--mono);font-size:12.5px;min-width:6.8em;resize:none;white-space:pre;overflow:hidden}
.ho-memo{min-width:3.6em;white-space:pre-wrap;word-break:break-all}
.ho-table .ch-alt{background-image:linear-gradient(var(--ch-shade),var(--ch-shade))}
.ho-table .ch-first{border-left:2px solid var(--ch-line)}
.ho-sub{display:flex;flex-direction:column;gap:6px}
.ho-sub h4{margin:6px 0 0;font-size:14px}
.ho-sub-head{display:flex;align-items:center;gap:10px}
.ho-sub-head h4{margin:0}
.ho-shot.ho-shot-sm{margin-left:0;padding:3px 10px;font-size:12.5px;border-radius:6px}
.ho-table.ho-pp{min-width:0;width:auto}
.ho-subs{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-start}
.ho-subs .ho-sub{min-width:0;max-width:100%}
.ho-table.ho-ny{min-width:0;width:auto}
.ho-ny td,.ho-ny thead th:not(:first-child){min-width:4.6em}
.ho-pp .ho-num,.ho-ny .ho-num{width:5em}
.ho-src{margin-top:6px;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ho-ny-box{border-radius:8px;transition:outline-color .15s;outline:2px dashed transparent;outline-offset:4px}
.ho-ny-box.drop-on{outline-color:var(--accent)}
.ho-imp-btn{background:var(--accent);color:#fff}
.ho-imp{position:fixed;inset:0;z-index:50;background:rgba(15,20,18,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
.ho-imp-panel{background:var(--paper);color:var(--ink);border-radius:12px;padding:18px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px #0004}
.ho-imp-panel h3{margin:0;font-size:18px}
.ho-imp-file{display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:14px;word-break:break-all}
.ho-imp-file small{color:var(--muted);font-size:12.5px}
.ho-imp-sec{display:flex;flex-direction:column;gap:8px}
.ho-imp-sec h4{margin:0;font-size:15px}
.ho-imp-help{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.ho-imp-chips{display:flex;flex-wrap:wrap;gap:6px}
.ho-chip{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;min-width:4.6em;font-family:var(--mono);font-size:14px;font-weight:600}
.ho-chip small{font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted)}
.ho-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ho-chip.on small{color:#e6f3ee}
.ho-table.ho-imp-table{width:100%}
.ho-imp-table td{font-family:var(--mono);padding:6px 4px;line-height:1.15}
.ho-imp-table td.chg,.ho-imp-help .chg{color:var(--high);font-weight:700}
.ho-imp-table .old{display:block;color:var(--muted);text-decoration:line-through;font-size:11px;font-weight:400}
.ho-imp-acts{display:flex;gap:8px}
.ho-imp-acts .ho-shot-close{color:var(--ink);border-color:var(--line)}
.ho-imp-acts .ho-shot-save:disabled{opacity:.6}
.ho-sla{min-width:7.2em;padding:0 !important}
.ho-sla-none{color:var(--muted)}
.ho-sla-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:38px;border:0;background:none;color:var(--ink);padding:4px 6px;cursor:pointer;font-family:var(--mono)}
.ho-sla-btn:hover{background:var(--accent-soft)}
.ho-sla-btn b{font-size:13.5px}
.ho-sla-btn small{font-family:var(--body);font-size:11px;color:var(--muted)}
.ho-sla.late .ho-sla-btn b,.ho-sla.late .ho-sla-btn small{color:var(--high)}

    <button type="button" class="link" id="clearDone">완료 항목 지우기</button>
  </div>

  <ul class="todos" id="list"></ul>
  <p class="hint">할 일 글자를 더블클릭하면 수정할 수 있어요 · 이 링크로 들어온 모든 사람이 같은 내용을 봐요<br><span class="sync" id="sync"><i></i><span id="syncText">불러오는 중…</span></span></p>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
  const POLL_MS = 10000;
  const $ = s => document.querySelector(s);
  const list = $('#list');
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const todayIso = isoOf(now);
  const WEEK = ['일','월','화','수','목','금','토'];
  const longDate = iso => { const d = new Date(iso+'T00:00:00'); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WEEK[d.getDay()]})`; };
  const SHIFTS = [
    {key:'day', name:'주간조'},
    {key:'eve', name:'오후조'},
    {key:'night', name:'심야조'},
  ];
  const prioLabel = {high:'높음', mid:'보통', low:'낮음'};
  const prioOrder = {high:0, mid:1, low:2};

  let items = [], templates = [], checks = {};
  let rev = -1, loadedMonths = '';
  let loaded = false, pending = 0, editing = false, editMode = false;
  const store = {
    get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e) { return d; } },
    set(k, v){ try { localStorage.setItem(k, v); } catch(e) {} },
    del(k){ try { localStorage.removeItem(k); } catch(e) {} },
  };
  let filter = store.get('todo-filter', 'all');
  let view = store.get('todo-view2', 'cal');
  if (view === 'prod' && document.querySelector('.seg [data-v=prod]')?.hidden) view = 'cal';   // 숨긴 탭에 머물러 있지 않게
  let teamKey = store.get('team-key', '');
  let editKey = '', askEdit = false;
  let openShifts = new Set();
  try { openShifts = new Set(JSON.parse(store.get('open-shifts', '[]'))); } catch(e) {}
  try { editKey = sessionStorage.getItem('edit-key') || ''; } catch(e) {}
  const setEditKey = k => { editKey = k; try { k ? sessionStorage.setItem('edit-key', k) : sessionStorage.removeItem('edit-key'); } catch(e) {} };
  let selDate = todayIso;
  let calMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  $('#today').textContent = now.toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});

  function setSync(state, text){ $('#sync').className = 'sync' + (state ? ' ' + state : ''); $('#syncText').textContent = text; }
  let toastTimer;
  function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4000); }

  class Locked extends Error {}
  class EditLocked extends Error {}
  function showLock(msg){
    $('#app').hidden = true; $('#lock').hidden = false;
    $('#lockErr').textContent = msg || '';
    $('#lockPw').focus();
  }

  async function request(method, url, body){
    const headers = {};
    if (body) headers['Content-Type'] = 'application/json';
    if (teamKey) headers['x-team-key'] = encodeURIComponent(teamKey);
    if (editKey && url.startsWith('/api/shifts')) headers['x-edit-key'] = encodeURIComponent(editKey);
    const r = await fetch(url, {method, headers, body: body ? JSON.stringify(body) : undefined, cache:'no-store'});
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Locked(data.error || '팀 비밀번호를 입력하세요.');
    if (data.editLocked) throw new EditLocked(data.error || '편집 비밀번호를 입력하세요.');
    if (!r.ok) throw new Error(data.error || '서버에 연결하지 못했어요.');
    return data;
  }
  async function api(method, url, body){
    pending++; setSync('busy', '저장 중…');
    try { return await request(method, url, body); } finally { pending--; }
  }

  // 달력에 보이는 달(앞뒤 포함)의 체크 기록을 불러옴
  function monthsNeeded(){
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    return [new Date(y, m-1, 1), new Date(y, m, 1), new Date(y, m+1, 1)].map(d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`).join(',');
  }

  async function loadFull(){
    const months = monthsNeeded();
    try {
      const data = await request('GET', '/api/state?months=' + months);
      if (pending || editing) return;
      items = data.todos || []; templates = data.templates || []; checks = data.checks || {};
      rev = data.rev; loadedMonths = months; loaded = true;
      render();
      if (view === 'ho' && hoRev !== rev && !hoFocused()) loadHandover();
      if (view === 'ret' && retRev !== rev) loadReturns();
      if (view === 'over' && ovRev !== rev) loadOvers();
      if (view === 'prod' && prRev !== rev) prLoad();
      setSync('', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    } catch(e) {
      if (e instanceof Locked) return showLock(teamKey ? e.message : '');
      setSync('err', e.message);
      if (!loaded) { list.innerHTML = ''; const li = document.createElement('li'); li.className = 'empty'; li.textContent = e.message; list.appendChild(li); }
    }
  }

  async function poll(){
    if (pending || editing || document.hidden || !$('#lock').hidden) return;
    if (monthsNeeded() !== loadedMonths) return loadFull();
    try {
      const data = await request('GET', '/api/state?only=rev');
      if (view === 'ho' && data.rev !== hoRev && !hoFocused()) loadHandover();
      if (view === 'ret' && data.rev !== retRev) loadReturns();
      if (view === 'over' && data.rev !== ovRev) loadOvers();
      if (view === 'prod' && data.rev !== prRev) prLoad();
      if (data.rev !== rev) loadFull();
      else setSync('', '동기화됨 · ' + new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
    } catch(e) {
      if (e instanceof Locked) return showLock(e.message);
      setSync('err', e.message);
    }
  }

  // 낙관적 업데이트: 화면을 먼저 바꾸고, 실패하면 되돌림
  async function mutate(apply, req){
    const before = JSON.stringify({items, templates, checks});
    apply(); render();
    try {
      await req();
      setSync('', '저장됨');
    } catch(e) {
      ({items, templates, checks} = JSON.parse(before)); render();
      if (e instanceof Locked) return showLock(e.message);
      if (e instanceof EditLocked){ setEditKey(''); editMode = false; askEdit = true; render(); $('#editErr').textContent = e.message; $('#editPw').focus(); setSync('', '저장 안 됨'); loadFull(); return; }
      toast(e.message); setSync('err', e.message);
    }
    loadFull();
  }

  // ---------- 체크리스트 ----------
  const activeOn = (t, date) => t.start <= date && (!t.end || date < t.end);
  const orderT = (a,b) => String(a.createdAt).localeCompare(String(b.createdAt));
  function dayChecklist(date){
    const byShift = {day:[], eve:[], night:[]};
    for (const t of templates) if (byShift[t.shift] && activeOn(t, date)) byShift[t.shift].push(t);
    for (const k in byShift) byShift[k].sort(orderT);
    const done = checks[date] || {};
    let total = 0, doneN = 0;
    for (const k in byShift) for (const t of byShift[k]) { total++; if (done[t.id]) doneN++; }
    return {byShift, done, total, doneN};
  }

  // 체크 항목 글자: 앞의 '공통 · '는 빼고, 끝의 (괄호 설명)은 작은 회색 글씨로
  function chkText(text){
    const span = document.createElement('span'); span.className = 't';
    let main = String(text).replace(/^공통\s*·\s*/, ''), note = '';
    const m = main.match(/^(.*\S)\s*\(([^()]*)\)\s*$/);
    if (m){ main = m[1]; note = m[2]; }
    const m1 = document.createElement('span'); m1.className = 'm';
    main.split(/\s+·\s+/).forEach((part, i) => {
      if (i){ const d = document.createElement('i'); d.className = 'dot'; d.textContent = '·'; m1.append(d); }
      m1.append(part);
    });
    span.append(m1);
    if (note){ const n = document.createElement('small'); n.className = 'note'; n.textContent = note; span.append(n); }
    return span;
  }

  function renderShifts(){
    const box = $('#shifts');
    box.innerHTML = '';
    const {byShift, done} = dayChecklist(selDate);
    const anyEver = templates.length > 0;
    for (const s of SHIFTS){
      const list_ = editMode ? templates.filter(t => t.shift === s.key && activeOn(t, todayIso)).sort(orderT) : byShift[s.key];
      const isOpen = editMode || openShifts.has(s.key);
      const n = list_.length, d = list_.filter(t => done[t.id]).length;
      const card = document.createElement('section');
      card.className = 'shift s-' + s.key + (isOpen ? ' open' : '');

      // 접고 펴는 제목 줄
      const tg = document.createElement('button');
      tg.type = 'button'; tg.className = 'shift-toggle';
      tg.setAttribute('aria-expanded', isOpen);
      tg.setAttribute('aria-controls', 'body-' + s.key);
      const name = document.createElement('span'); name.className = 'shift-name'; name.textContent = s.name;
      const cnt = document.createElement('span'); cnt.className = 'shift-count' + (n && d === n && !editMode ? ' full' : '');
      cnt.textContent = editMode ? `${n}개 항목` : (n ? (d === n ? `완료 ${d} / ${n}` : `${d} / ${n}`) : '항목 없음');
      const chev = document.createElement('span'); chev.className = 'chev'; chev.setAttribute('aria-hidden', 'true'); chev.textContent = '▾';
      tg.append(name, cnt, chev);
      tg.onclick = () => {
        if (editMode) return;
        if (openShifts.has(s.key)) openShifts.delete(s.key); else openShifts.add(s.key);
        store.set('open-shifts', JSON.stringify([...openShifts]));
        render();
      };
      card.appendChild(tg);
      if (!editMode && n){
        const bar = document.createElement('div'); bar.className = 'shift-bar';
        const fill = document.createElement('i'); fill.style.width = (d/n*100) + '%'; bar.appendChild(fill); card.appendChild(bar);
      }

      if (isOpen){
        const body = document.createElement('div'); body.className = 'shift-body'; body.id = 'body-' + s.key;
        if (!n){
          const p = document.createElement('p'); p.className = 'shift-empty';
          p.textContent = editMode ? '아래에 매일 할 항목을 추가하세요.'
            : !anyEver ? '아직 항목이 없어요. 위의 [체크리스트 편집]에서 추가하세요.'
            : '이날은 체크리스트 항목이 없어요.';
          body.appendChild(p);
        } else {
          // '공통 · '으로 시작하는 항목은 아래 '공통' 묶음으로 따로 보여줘요
          const isCommon = t => /^공통\s*·\s*/.test(t.text);
          const mainL = list_.filter(t => !isCommon(t)), commonL = list_.filter(isCommon);
          const ul = document.createElement('ul'); ul.className = 'checks';
          const lists = [[mainL, ul]];
          if (commonL.length){
            const h = document.createElement('p'); h.className = 'checks-sub';
            h.textContent = `공통 체크리스트 · ${commonL.length}`;
            const ul2 = document.createElement('ul'); ul2.className = 'checks';
            lists.push([commonL, ul2, h]);
          }
          for (const [arr, ulx] of lists) for (const t of arr){
            const ul = ulx;
            const li = document.createElement('li');
            const on = !editMode && Boolean(done[t.id]);
            if (on) li.classList.add('on');
            if (editMode){
              const span = document.createElement('span'); span.className = 't'; span.textContent = t.text; span.style.flex = '1';
              const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'rm'; rm.textContent = '×';
              rm.setAttribute('aria-label', `${s.name} 항목 삭제: ${t.text}`);
              rm.onclick = () => mutate(
                () => { const x = templates.find(y => y.id === t.id); if (x.start >= todayIso) templates = templates.filter(y => y.id !== t.id); else x.end = todayIso; },
                () => api('DELETE', '/api/shifts?id=' + encodeURIComponent(t.id)));
              li.append(span, rm);
            } else {
              const label = document.createElement('label');
              const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = on;
              const span = chkText(t.text);
              cb.onchange = () => {
                const v = cb.checked, date = selDate;
                mutate(() => { checks[date] = checks[date] || {}; if (v) checks[date][t.id] = {done:true, at:new Date().toISOString()}; else delete checks[date][t.id]; },
                       () => api('PUT', '/api/checks', {date, tid:t.id, done:v}));
              };
              label.append(cb, span);
              li.appendChild(label);
            }
            ul.appendChild(li);
          }
          for (const [, ulx, h] of lists){ if (h) body.appendChild(h); if (ulx.children.length) body.appendChild(ulx); }
        }
        if (editMode){
          const f = document.createElement('form'); f.className = 'shift-add'; f.autocomplete = 'off';
          const inp = document.createElement('input'); inp.type = 'text'; inp.maxLength = 120; inp.placeholder = `${s.name} 항목 추가`; inp.id = 'add-' + s.key;
          inp.setAttribute('aria-label', `${s.name} 항목 추가`);
          const b = document.createElement('button'); b.type = 'submit'; b.textContent = '추가';
          f.append(inp, b);
          f.onsubmit = e => {
            e.preventDefault();
            const text = inp.value.trim(); if (!text) return inp.focus();
            const temp = {id:'temp-'+Date.now(), shift:s.key, text, start:todayIso, end:'', createdAt:new Date().toISOString()};
            mutate(() => { templates.push(temp); }, async () => {
              const {item} = await api('POST', '/api/shifts', {shift:s.key, text});
              const i = templates.findIndex(x => x.id === temp.id); if (i > -1) templates[i] = item;
            });
            setTimeout(() => { const el = document.getElementById('add-' + s.key); if (el) el.focus(); }, 0);
          };
          body.appendChild(f);
        }
        card.appendChild(body);
      }
      box.appendChild(card);
    }
  }

  // ---------- 달력 ----------
  function renderCal(){
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    $('#calTitle').textContent = `${y}년 ${m+1}월`;
    const byDate = {};
    for (const t of items) if (t.due) (byDate[t.due] = byDate[t.due] || []).push(t);
    for (const k in byDate) byDate[k].sort((a,b) => (a.done-b.done) || (prioOrder[a.prio]-prioOrder[b.prio]));

    const grid = $('#calGrid');
    grid.innerHTML = '';
    WEEK.forEach((w,i) => { const d = document.createElement('div'); d.className = 'dow' + (i===0 ? ' sun' : i===6 ? ' sat' : ''); d.textContent = w; grid.appendChild(d); });
    const first = new Date(y, m, 1);
    const start = new Date(y, m, 1 - first.getDay());
    const weeks = Math.ceil((first.getDay() + new Date(y, m+1, 0).getDate()) / 7);
    for (let i = 0; i < weeks*7; i++){
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const iso = isoOf(d);
      const dayTodos = byDate[iso] || [];
      const cl = dayChecklist(iso);
      const cell = document.createElement('button');
      cell.type = 'button';
      cell.className = 'day' + (d.getMonth() !== m ? ' out' : '') + (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '')
        + (iso === todayIso ? ' today' : '') + (iso === selDate ? ' sel' : '');
      const showCk = cl.total && (iso <= todayIso || cl.doneN);
      cell.setAttribute('aria-label', `${longDate(iso)}` + (cl.total ? `, 체크리스트 ${cl.doneN}/${cl.total}` : '') + `, 할 일 ${dayTodos.length}개`);
      cell.setAttribute('aria-pressed', iso === selDate);
      const top = document.createElement('span'); top.className = 'day-top';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = d.getDate();
      top.appendChild(num);
      if (showCk){
        const ck = document.createElement('span');
        ck.className = 'ck' + (cl.doneN === cl.total ? ' full' : cl.doneN ? ' part' : '');
        ck.textContent = `✓${cl.doneN}/${cl.total}`;
        top.appendChild(ck);
      }
      cell.appendChild(top);
      dayTodos.slice(0, 3).forEach(t => {
        const ev = document.createElement('span');
        ev.className = 'ev ' + (prioLabel[t.prio] ? t.prio : 'mid') + (t.done ? ' done' : (iso < todayIso ? ' late' : ''));
        ev.textContent = t.text; cell.appendChild(ev);
      });
      if (dayTodos.length > 3){ const more = document.createElement('span'); more.className = 'more'; more.textContent = `+${dayTodos.length - 3}건 더`; cell.appendChild(more); }
      if (dayTodos.length){
        const open = dayTodos.filter(t => !t.done);
        const tc = document.createElement('span');
        tc.className = 'tcount' + (!open.length ? ' done' : open.some(t => t.prio === 'high') ? ' high' : '');
        tc.textContent = open.length ? `${open.length}건` : '✓';
        cell.appendChild(tc);
      }
      cell.onclick = () => {
        selDate = iso;
        if (d.getMonth() !== m) calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
        $('#newDue').value = iso;
        render();
        if (monthsNeeded() !== loadedMonths) loadFull();
      };
      grid.appendChild(cell);
    }
  }

  // ---------- 할 일 ----------
  function fmtDue(due){
    if (!due) return null;
    const diff = Math.round((new Date(due+'T00:00:00') - new Date(todayIso+'T00:00:00')) / 86400000);
    if (diff === 0) return '오늘까지';
    if (diff === 1) return '내일까지';
    if (diff < 0) return `${-diff}일 지남`;
    return `${due.slice(5).replace('-','/')}까지`;
  }

  function renderTodos(){
    const shown = items
      .filter(t => view !== 'cal' || t.due === selDate)
      .filter(t => filter==='all' || (filter==='done' ? t.done : !t.done))
      .sort((a,b) => (a.done-b.done) || (prioOrder[a.prio]-prioOrder[b.prio]) || ((a.due||'9999').localeCompare(b.due||'9999')) || String(a.createdAt||'').localeCompare(String(b.createdAt||'')));
    list.innerHTML = '';
    if (!shown.length){
      const li = document.createElement('li'); li.className = 'empty';
      li.textContent = !loaded ? '불러오는 중…'
        : view==='cal' ? '이날 마감인 할 일이 없어요. 위에서 추가하면 이 날짜로 들어가요.'
        : filter==='done' ? '아직 완료한 일이 없어요.'
        : filter==='active' ? '남은 일이 없어요. 수고했어요!'
        : '첫 번째 할 일을 추가해 보세요.';
      list.appendChild(li);
    }
    for (const t of shown){
      const li = document.createElement('li');
      li.className = 'p-' + (prioLabel[t.prio] ? t.prio : 'mid');
      if (t.done) li.classList.add('done');
      const chk = document.createElement('button');
      chk.type='button'; chk.className='check'; chk.textContent='✓';
      chk.setAttribute('aria-label', t.done ? '완료 취소' : '완료로 표시');
      chk.onclick = () => { const v = !t.done; mutate(() => { t.done = v; }, () => api('PATCH', '/api/todos?id='+encodeURIComponent(t.id), {done:v})); };
      const body = document.createElement('div'); body.className='body';
      const text = document.createElement('span'); text.className='text'; text.textContent=t.text; text.title='더블클릭해서 수정';
      text.ondblclick = () => startEdit(t, body, text);
      const meta = document.createElement('div'); meta.className='meta';
      const p = prioLabel[t.prio] ? t.prio : 'mid';
      const chip = document.createElement('span'); chip.className = 'chip ' + p; chip.textContent = prioLabel[p];
      meta.appendChild(chip);
      const d = fmtDue(t.due);
      if (d){ const s = document.createElement('span'); s.className = 'due' + (!t.done && t.due < todayIso ? ' late' : ''); s.textContent = d; meta.appendChild(s); }
      body.append(text, meta);
      const del = document.createElement('button');
      del.type='button'; del.className='del'; del.textContent='×'; del.setAttribute('aria-label','삭제');
      del.onclick = () => mutate(() => { items = items.filter(x => x.id !== t.id); }, () => api('DELETE', '/api/todos?id='+encodeURIComponent(t.id)));
      li.append(chk, body, del);
      list.appendChild(li);
    }
    const doneN = items.filter(t=>t.done).length;
    $('#progressNum').textContent = `할 일 ${doneN} / ${items.length} 완료`;
    $('#barFill').style.width = items.length ? (doneN/items.length*100)+'%' : '0';
    $('#clearDone').hidden = doneN === 0;
  }

  function render(){
    document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === filter));
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === view));
    const cal = view === 'cal';
    const hoView = view === 'ho', retView = view === 'ret', prodView = view === 'prod', overView = view === 'over';
    $('#ho').hidden = !hoView;
    $('#ret').hidden = !retView;
    $('#prod').hidden = !prodView;
    $('#over').hidden = !overView;
    $('#app').classList.toggle('wide', prodView || overView);
    for (const id of ['#addForm', '#list']) $(id).hidden = hoView || retView || prodView || overView;
    document.querySelector('.toolbar').hidden = hoView || retView || prodView || overView;
    if (prodView && !$('#prod').hasChildNodes()) renderProd();
    if (prodView && prRev < 0) prLoad();
    if (hoView && !$('#ho').hasChildNodes()) renderHandover();
    if (retView && !retBuilt) renderReturns();
    if (overView && !ovBuilt) renderOvers();
    for (const id of ['#cal', '#dayHead', '#shifts', '#todoLabel']) $(id).hidden = !cal;
    $('#editNote').hidden = !(cal && editMode);
    $('#editLock').hidden = !(cal && askEdit && !editMode);
    $('#editToggle').setAttribute('aria-pressed', editMode);

  // ---------- 인수인계: 챔버별 음영 ----------
  // 칸마다 표 안의 실제 열 위치를 계산해서 챔버를 찾고, 1C·3C·6C에 음영(머리글~합계까지), 챔버 사이에 굵은 선을 넣어요.
  function hoShade(table){
    if (!table) return;
    const chOfCol = [null, ...HO_COLS.map(([ck]) => hoCh(ck))];   // 0번 열은 분류
    const taken = [];
    const lastShade = [...table.rows].findIndex(tr => tr.classList.contains('ho-total'));
    [...table.rows].forEach((tr, r) => {
      let c = 0;
      for (const cellEl of tr.cells){
        while (taken[r] && taken[r][c]) c++;
        const span = cellEl.colSpan || 1, rs = cellEl.rowSpan || 1;
        for (let i = 0; i < rs; i++) for (let j = 0; j < span; j++) (taken[r + i] = taken[r + i] || [])[c + j] = true;
        const chs = new Set(chOfCol.slice(c, c + span));
        if (chs.size === 1 && !chs.has(null)){
          const ch = [...chs][0];
          if (ch % 2 === 1 && r <= lastShade) cellEl.classList.add('ch-alt');
          if (chOfCol[c - 1] !== ch) cellEl.classList.add('ch-first');
        } else if (c > 0) cellEl.classList.add('ch-first');
        c += span;
      }
    });
  }

  // ---------- 인수인계: 엔터 치면 아래 칸으로 ----------
  // 표마다 칸의 (줄, 열) 위치를 적어 두고, 엔터를 치면 같은 열의 아래 칸으로 옮겨요.
  // 열의 맨 아래면 다음 열의 맨 위로, 표의 끝이면 다음 표의 첫 칸으로 가요.
  function hoGridIndex(box){
    box.querySelectorAll('table').forEach((table, t) => {
      table.querySelectorAll('tbody tr').forEach((tr, r) => {
        let c = 0;
        for (const cellEl of tr.children){
          const f = cellEl.querySelector('input, textarea:not(.ho-memo)');   // 비고 메모는 엔터 이동에서 빼요
          if (f){ f.dataset.gt = t; f.dataset.gr = r; f.dataset.gc = c; f.dataset.gs = cellEl.colSpan || 1; f.setAttribute('enterkeyhint', 'next'); }
          c += cellEl.colSpan || 1;
        }
      });
    });
  }
  function hoNextCell(cur){
    const all = [...$('#ho').querySelectorAll('[data-gt]')].map(n => ({ n, t:+n.dataset.gt, r:+n.dataset.gr, c:+n.dataset.gc, s:+n.dataset.gs || 1 }));
    const me = { t:+cur.dataset.gt, r:+cur.dataset.gr, c:+cur.dataset.gc };
    const pick = list => list.sort((a, b) => a.c - b.c || a.r - b.r)[0];
    return pick(all.filter(x => x.t === me.t && x.r > me.r && x.c <= me.c && me.c < x.c + x.s))
        || pick(all.filter(x => x.t === me.t && x.c > me.c))
        || pick(all.filter(x => x.t > me.t).sort((a, b) => a.t - b.t).filter((x, _, arr) => x.t === arr[0].t));
  }
  $('#ho').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    const cur = e.target.closest('[data-gt]');
    if (!cur) return;
    e.preventDefault();
    if (e.altKey && cur.tagName === 'TEXTAREA'){
      // Alt+Enter: 줄 바꾸기 (차량번호 여러 대 등) → 칸이 늘어나요
      cur.setRangeText('\n', cur.selectionStart, cur.selectionEnd, 'end');
      cur.dispatchEvent(new Event('input', { bubbles:true }));

    const next = hoNextCell(cur);
    if (next){ next.n.focus(); if (next.n.select) next.n.select(); }
    else cur.blur();

  function hoWrap(ctx, text, maxW){
    const out = [];
    for (const para of String(text || '').split('\n')){
      let line = '';
      for (const ch of para){
        if (ctx.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
        else line += ch;
      }
      out.push(line);
    }
    while (out.length && !out[out.length - 1]) out.pop();
    return out;
  }

  // ---------- Backlog: 이관 목록 엑셀로 자동 계산 ----------
  // 파일은 이 브라우저 안에서만 읽어요. 서버에는 계산된 숫자, RC 차량 목록, 파일 이름만 저장돼요.
  // 규칙: 보내는 센터가 INC17·INC39·YON3일 때만 XD/RC — 이관계획 번호 없음 → XD / 있음 + RC 차량 → RC
  //       그 밖의 줄(다른 센터, RC가 아닌 차량)은 모두 RM
  //       상태 이동중 → NYR, 진열대기·진열중 → NYS (진열완료 등은 제외), 값은 집품수량 합계
  const hoWhen = iso => { const t = new Date(iso); return isNaN(t) ? '' : `${t.getMonth() + 1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}`; };
  const carKey = s => { const n = String(s || '').replace(/\D/g, ''); return n.length >= 4 ? n.slice(-4) : n; };   // 차량번호는 뒤 4자리로 비교
  const HO_XDRC_CENTERS = ['INC17', 'INC39', 'YON3'];   // XD·RC가 출발하는 센터 (띄어쓰기 무시)
  const isXdRcCenter = s => HO_XDRC_CENTERS.includes(String(s || '').replace(/\s/g, '').toUpperCase());
  const splitCars = s => String(s || '').split(/[\s,，/]+/).map(x => x.trim()).filter(Boolean);

  function hoPickExcel(){
    const inp = el('input', { type:'file', accept:'.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    inp.onchange = () => { if (inp.files[0]) hoImportFile(inp.files[0]); };

  // .xlsx(zip) 안의 첫 번째 시트를 줄 배열로 읽어요 (외부 라이브러리 없이)
  async function hoReadXlsx(file){
    const buf = new Uint8Array(await file.arrayBuffer());
    const dv = new DataView(buf.buffer);
    let e = buf.length - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('엑셀(.xlsx) 파일이 아니에요.');
    const count = dv.getUint16(e + 10, true);
    let p = dv.getUint32(e + 16, true);
    const files = {}, dec = new TextDecoder();
    for (let i = 0; i < count; i++){
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
      files[dec.decode(buf.subarray(p + 46, p + 46 + nl))] = { method, size, off };
      p += 46 + nl + xl + cl;
    }
    const read = async name => {
      const f = files[name];
      if (!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const data = buf.subarray(start, start + f.size);
      if (f.method === 0) return dec.decode(data);
      if (f.method !== 8 || typeof DecompressionStream === 'undefined') throw new Error('이 브라우저에서는 엑셀을 읽을 수 없어요. 크롬이나 최신 사파리로 열어 주세요.');
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };
    const xml = s => new DOMParser().parseFromString(s, 'application/xml');
    // 첫 번째 시트 파일 찾기
    let sheetPath = null;
    try {
      const wb = xml(await read('xl/workbook.xml'));
      const rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id');
      const rels = xml(await read('xl/_rels/workbook.xml.rels'));
      for (const r of rels.getElementsByTagName('Relationship')) if (r.getAttribute('Id') === rid){ const t = r.getAttribute('Target'); sheetPath = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, ''); }
    } catch { /* 아래에서 대신 찾기 */ }
    if (!sheetPath || !files[sheetPath]) sheetPath = Object.keys(files).filter(n => /^xl\/worksheets\/[^/]+\.xml$/.test(n)).sort()[0];
    if (!sheetPath) throw new Error('엑셀 안에서 시트를 찾지 못했어요.');
    const ssx = await read('xl/sharedStrings.xml');
    const ss = ssx ? [...xml(ssx).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
    const doc = xml(await read(sheetPath));
    const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const rows = [];
    for (const r of doc.getElementsByTagName('row')){
      const out = [];
      for (const c of r.getElementsByTagName('c')){
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        let val = '';
        if (t === 's') val = ss[+(v && v.textContent)] ?? '';
        else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else val = v ? v.textContent : '';
        out[colIdx(c.getAttribute('r') || '')] = val;
      }
      rows.push(out);
    }
    return rows;
  }

  // 줄 배열 → 계산에 필요한 줄만 추려 두기
  function hoPrepRows(rows){
    const norm = s => String(s || '').replace(/\s/g, '');
    const hi = rows.findIndex(r => r && r.some(v => norm(v) === '상태'));
    if (hi < 0) throw new Error("'상태' 열을 찾지 못했어요. 이관 목록(TransferOperationList) 엑셀인지 확인해 주세요.");
    const H = rows[hi].map(norm);
    const need = { plan:'이관계획번호', status:'상태', qty:'집품수량', car:'차량번호', from:'보내는센터' };
    const col = {};
    const miss = [];
    for (const [k, name] of Object.entries(need)){ col[k] = H.indexOf(name); if (col[k] < 0) miss.push(name); }
    if (miss.length) throw new Error('엑셀에 이 열이 없어요: ' + miss.join(', '));
    col.unload = H.indexOf('하차완료시간');   // SLA 계산용 (없으면 SLA는 비워 둬요)
    const items = [];
    let done = 0, other = 0;
    for (const r of rows.slice(hi + 1)){
      if (!r || !r.some(v => String(v || '').trim())) continue;
      const st = String(r[col.status] || '').trim();
      const kind = st === '이동중' ? 'nyr' : (st === '진열대기' || st === '진열중') ? 'nys' : null;
      if (!kind){ if (st === '진열완료') done++; else other++; continue; }
      const q = parseFloat(String(r[col.qty] || '').replace(/,/g, ''));
      items.push({ kind, plan: !!String(r[col.plan] || '').trim(), car: String(r[col.car] || '').trim(), main: isXdRcCenter(r[col.from]), qty: isNaN(q) ? 0 : q,
        unload: col.unload >= 0 ? slaDate(hoXlTime(r[col.unload])) : null });
    }
    return { total: rows.length - hi - 1, items, done, other };
  }

  // 엑셀 시간 칸: 글자('2026-09-25 15:48:48')나 엑셀 날짜 숫자 모두 받아요
  const hoXlTime = s => {
    const t = String(s || '').trim();
    if (/^\d+(\.\d+)?$/.test(t)){ const d = new Date(Math.round((parseFloat(t) - 25569) * 86400000)); return slaStr(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes())); }
    return t;
  };

  function hoCalc(prep, rcSet){
    const v = { xd:{ nys:0, nyr:0 }, rc:{ nys:0, nyr:0 }, rm:{ nys:0, nyr:0 } };
    const first = {};   // 줄마다 가장 이른 하차완료 시간 (NYS만)
    for (const it of prep.items){
      const row = !it.main ? 'rm' : !it.plan ? 'xd' : rcSet.has(carKey(it.car)) ? 'rc' : 'rm';
      v[row][it.kind] += it.qty;
      if (it.kind === 'nys' && it.unload && HO_SLA_HOURS[row] && (!first[row] || it.unload < first[row])) first[row] = it.unload;
    }
    for (const r in v) for (const k in v[r]) v[r][k] = Math.round(v[r][k] * 10) / 10;
    v.sla = {};
    for (const r in HO_SLA_HOURS) v.sla[r] = first[r] ? slaStr(new Date(first[r].getTime() + HO_SLA_HOURS[r] * 3600000)) : '';
    return v;
  }

    const d = hoData.day;
    const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
    const C = { bg:'#ffffff', ink:'#1d2521', muted:'#6b746f', line:'#cfd6d2', head:'#eef2ef', acc:'#1f6f54', accSoft:'#e3f1ea' };
    const PAD = 32, NL = 90, NW = 110, SW = 140, ROW = 38, TOP = 92;
    const W = PAD * 2 + NL + NW * (HO_NY_COLS.length + 1) + SW, sx = W - PAD - SW;
    const H = TOP + ROW * (HO_NY_ROWS.length + 2) + 44;
    const scale = 2, cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext('2d'); ctx.scale(scale, scale);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.textBaseline = 'middle';
    const setFont = (size, bold, mono) => ctx.font = `${bold ? 700 : 400} ${size}px ${mono ? 'ui-monospace,Menlo,Consolas,monospace' : FONT}`;
    const cell = (x, y, w, h, fill) => { if (fill){ ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); } ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w, h); };
    const text = (t, x, y, o = {}) => { setFont(o.size || 14, o.bold, o.mono); ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || 'center'; ctx.fillText(t, x, y); };
    const round = n => String(Math.round(n * 10) / 10);

    text('GWJ3 IB · 인수인계', PAD, 28, { size:13, color:C.muted, align:'left' });
    text('Backlog', PAD, 58, { size:22, bold:true, align:'left' });
    text(hoDateOf().slice(0, 4) + '년 ' + longDate(hoDateOf()), W - PAD, 58, { size:15, bold:true, align:'right' });

    let y = TOP;
    cell(PAD, y, NL, ROW, C.head); text('구분', PAD + NL / 2, y + ROW / 2, { bold:true });
    [...HO_NY_COLS.map(([, l]) => l), '합계'].forEach((l, i) => { const x = PAD + NL + i * NW; cell(x, y, NW, ROW, C.head); text(l, x + NW / 2, y + ROW / 2, { bold:true }); });
    cell(sx, y, SW, ROW, C.head); text('SLA', sx + SW / 2, y + ROW / 2, { bold:true });
    let total = 0, anyT = false;
    HO_NY_ROWS.forEach(([rk, rl]) => {
      y += ROW;
      cell(PAD, y, NL, ROW, C.head); text(rl, PAD + 12, y + ROW / 2, { bold:true, align:'left' });
      let t = 0, any = false;
      HO_NY_COLS.forEach(([ck], i) => {
        const x = PAD + NL + i * NW; cell(x, y, NW, ROW);
        const v = d[`ny:${rk}:${ck}`];
        if (v !== undefined && v !== ''){ text(String(v), x + NW / 2, y + ROW / 2, { mono:true, size:15 }); const n = parseFloat(v); if (!isNaN(n)){ t += n; any = true; } }
      });
      const x = PAD + NL + HO_NY_COLS.length * NW; cell(x, y, NW, ROW);
      text(any ? round(t) : '–', x + NW / 2, y + ROW / 2, { mono:true, bold:true, size:15, color:C.muted });
      cell(sx, y, SW, ROW);
      const sv = HO_SLA_HOURS[rk] ? slaText(d[`sla:${rk}`]) : '';
      text(sv || '–', sx + SW / 2, y + ROW / 2, sv ? { mono:true, bold:true, size:15 } : { size:14, color:C.muted });

    cell(PAD + NL, y, NW * HO_NY_COLS.length, ROW, C.accSoft);
    const xt = PAD + NL + HO_NY_COLS.length * NW; cell(xt, y, NW, ROW, C.accSoft);
    text(anyT ? round(total) : '–', xt + NW / 2, y + ROW / 2, { mono:true, bold:true, size:15, color:C.acc });
    cell(sx, y, SW, ROW, C.accSoft);

    const now = new Date();
    text(`캡쳐 ${isoOf(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`, W - PAD, H - 18, { size:11, color:C.muted, align:'right' });

    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const name = `Backlog_${hoDateOf()}.png`;
    if (matchMedia('(pointer:coarse)').matches) return hoShotView(cv.toDataURL('image/png'), blob, name);
    hoDownload(blob, name);
    toast('Backlog 이미지를 저장했어요.');

    setTimeout(() => URL.revokeObjectURL(url), 10000);

  // 휴대폰: 캡쳐 이미지를 띄우고 갤러리(사진)에 저장
  function hoShotView(dataUrl, blob, name){

  }
  const RET_HEAD = [['date', /하차|입고일|발생일|일자|날짜|date/i], ['barcode', /바코드|barcode/i], ['sku', /sku/i], ['po', /발주|ipr|\bpo\b|주문번호/i],

  function retGuessMap(rows){
    const n = Math.max(...rows.map(r => r.length));

  function retParseDate(v){

  // 칸 연결대로 회송 건으로 바꾸고, 빈 온도 · 업체는 예전 기록(같은 바코드/SKU)에서 채워요

  // ---- 회송 확인서 인쇄 (업체마다 A4 한 장) ----
  // 확인서가 A4 한 장을 넘으면 비율을 줄여서 무조건 한 장에 들어가게 해요
  function retFitPages(area){
    const mm = 96 / 25.4, W = 184 * mm, H = 268 * mm;   // A4(210×297) − 여백 12mm, 테두리가 잘리지 않게 조금 여유
    area.classList.add('measuring');
    for (const page of area.querySelectorAll('.rp-page')){
      const inner = page.firstElementChild;
      // 줄인 만큼 넓게 그려서 가로는 꽉 차게 — 한 장에 들어가는 가장 큰 비율을 찾아요
      const fits = k => { inner.style.zoom = k; inner.style.width = (W / k) + 'px'; return inner.getBoundingClientRect().height <= H; };
      let s = 1;
      if (!fits(1)){
        let lo = 0.2, hi = 1;
        for (let i = 0; i < 14; i++){ const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
        s = lo; fits(s);
      }
      page.dataset.scale = s.toFixed(3);
    }
    area.classList.remove('measuring');
  }

  function retPrint(list){
    if (!list.length) return;
    const groups = new Map();
    for (const t of list){ if (!groups.has(t.vendor)) groups.set(t.vendor, []); groups.get(t.vendor).push(t); }
    const now = new Date();
    const stamp = `${isoOf(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const dayName = ['일','월','화','수','목','금','토'][now.getDay()];
    const area = el('div', { id:'ret-print' }, ...[...groups.entries()].map(([vendor, items]) => {
      items.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
      const qty = items.reduce((s, t) => s + (+t.qty || 0), 0);
      return el('div', { class:'rp-page' }, el('div', { class:'rp-inner' },
        el('h1', { text:'GWJ3 센터 회송 확인서' }),
        el('p', { class:'rp-date', text: `${todayIso} (${dayName})` }),
        el('table', { class:'rp-info' },
          el('tr', {}, el('th', { text:'업체명' }), el('td', { colspan:'3', class:'rp-vendor', text: vendor })),
          el('tr', {}, el('th', { text:'인수자 성함' }), el('td', {}), el('th', { text:'연락처' }), el('td', {}))),
        el('p', { class:'rp-tot', text: `총 SKU : ${items.length}　　총 UNIT : ${retNum(qty)}` }),
        el('table', { class:'rp-items' },
          el('thead', {}, el('tr', {}, ...['No','하차일','발주/IPR','SKU ID','바코드','상품명','회송사유','온도','수량'].map(h => el('th', { text:h })))),
          el('tbody', {}, ...items.map((t, i) => el('tr', {},
            el('td', { class:'c', text: i + 1 }), el('td', { class:'c', text: retMD(t.date) }), el('td', { text: t.po || '' }), el('td', { text: t.sku || '' }), el('td', { text: t.barcode || '' }),
            el('td', { text: t.name }), el('td', { text: t.reason }), el('td', { class:'c', text: retTemp(t.temp) }), el('td', { class:'r', text: retNum(t.qty) }))),
            el('tr', { class:'rp-sum' }, el('td', { colspan:'8', class:'r', text:'합계' }), el('td', { class:'r', text: retNum(qty) })))),
        el('div', { class:'rp-sign' }, el('div', { text:'인계자 (GWJ3)　　　　　　(서명)' }), el('div', { text:'인수자 (업체)　　　　　　(서명)' })),
        el('p', { class:'rp-foot', text: `GWJ3 IB · 출력 ${stamp}` })));
    }));
    document.querySelectorAll('#ret-print').forEach(n => n.remove());
    document.body.appendChild(area);
    retFitPages(area);
    const done = () => { area.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
  }

  function ovBuild(box){
    const f = (key, label, o = {}) => {
      const inp = el(o.tag || 'input', { id:'ov-' + key, class:'ret-in' + (o.mono ? ' ov-mono' : ''), type: o.type, inputmode: o.im, list: o.list, placeholder: o.ph || '', maxlength: o.max, autocomplete:'off' });
      inp.oninput = () => { ovForm[key] = inp.value; if (key === 'sku' || key === 'barcode') ovLookup(key); if (key === 'name' || key === 'vendor') ovUi.auto = false; };
      return el('div', { class:'ret-f ' + (o.cls || 'span2') }, el('label', { for:'ov-' + key, text: label + (o.req ? ' *' : ''), }, o.note ? el('small', { text: o.note }) : null), inp);
    };
    const who = el('select', { id:'ov-who', class:'ret-in', onchange: e => { ovForm.who = e.target.value; ovSetLS('ov-who', e.target.value); } },
      el('option', { value:'', text:'고르세요' }), ...OV_WHO.map(n => el('option', { value:n, text:n })));
    const mailIn = el('input', { id:'ov-mail', class:'ret-in ov-mono', type:'date', oninput: e => { ovForm.mail = e.target.value; ovFillForm(); } });
    const mailToday = el('button', { type:'button', class:'ov-today', id:'ov-mail-today', onclick: () => { ovForm.mail = ovForm.mail === ovToday ? '' : ovToday; ovFillForm(); } }, '오늘 보냄');
    const form = el('form', { class:'ret-sec ret-form', id:'ov-form', autocomplete:'off' },
      el('div', { class:'ret-sec-head' }, el('h3', { id:'ov-form-title', text:'과매입 건 입력' }),
        el('p', { class:'ret-help', text:'Tab으로 다음 칸 · Enter로 추가 · * 필수' })),
      el('div', { class:'ret-grid ov-grid' },
        f('sku', '외부 SKU ID', { im:'numeric', max:40, mono:true, ph:'적으면 지난 기록에서 채워요' }),
        f('barcode', '상품 바코드', { im:'numeric', max:40, mono:true }),
        f('qty', '수량', { req:true, im:'decimal', max:10, mono:true }),
        el('p', { class:'ov-found', id:'ov-found', hidden:true }),
        f('name', '상품명', { req:true, max:150, cls:'span4' }),
        f('vendor', '업체명', { req:true, max:80, list:'ov-vendors', note:'자동완성' }),
        f('date', '생성일자', { type:'date', mono:true }),
        el('div', { class:'ret-f span2' }, el('label', { for:'ov-who', text:'처리자' }), who),
        el('div', { class:'ret-f span2' }, el('label', { for:'ov-mail', text:'메일 발송일' }), el('div', { class:'ov-mail' }, mailToday, mailIn)),
        f('comm', '업체소통', { max:200, cls:'span6', ph:'예) 9/22 재회신 · 리마인드 보냄' })),
      el('div', { class:'ret-acts' },
        el('span', { class:'ret-help', id:'ov-form-msg', text:'생성일자 · 처리자는 다음 건에도 그대로 남아요' }),
        el('button', { type:'button', class:'ret-btn ghost ov-danger', id:'ov-del', hidden:true, text:'삭제', onclick: ovDelete }),
        el('button', { type:'button', class:'ret-btn ghost', id:'ov-status', hidden:true, onclick: () => { const t = ovItems.find(x => x.id === ovUi.editId); if (t) ovSetStatus(t, t.status === 'done' ? 'wait' : 'done'); ovEndEdit(); } }),
        el('button', { type:'button', class:'ret-btn ghost', id:'ov-cancel', hidden:true, text:'취소', onclick: () => ovEndEdit() }),
        el('button', { type:'submit', class:'ret-btn solid', id:'ov-submit', text:'추가' })),
      el('datalist', { id:'ov-vendors' }));
    form.onsubmit = e => { e.preventDefault(); ovSubmit(); };
    box.append(form,
      el('section', { class:'ret-sec', id:'ov-list' }),
      el('section', { class:'ret-sec', id:'ov-view' }));
  }

  function ovFillForm(){
    for (const k of OV_FIELDS){ const n = $('#ov-' + k); if (n && document.activeElement !== n) n.value = ovForm[k] ?? ''; }
    const mt = $('#ov-mail-today'); mt.setAttribute('aria-pressed', ovForm.mail && ovForm.mail === ovToday ? 'true' : 'false');
    const vendors = [...new Set([...(ovItems || []).map(t => t.vendor), ...OV_PAST.map(p => p[3])].filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
    $('#ov-vendors').replaceChildren(...vendors.map(v => el('option', { value: v })));
    const editing = !!ovUi.editId, it = editing && (ovItems || []).find(x => x.id === ovUi.editId);
    $('#ov-form').classList.toggle('editing', editing);
    $('#ov-form-title').textContent = editing ? '과매입 건 수정' : '과매입 건 입력';
    $('#ov-submit').textContent = editing ? '수정 저장' : '추가';
    $('#ov-cancel').hidden = $('#ov-del').hidden = $('#ov-status').hidden = !editing;
    if (it) $('#ov-status').textContent = it.status === 'done' ? '↩ 대기로 되돌리기' : '✓ 완료';
    $('#ov-del').textContent = ovDelArm && Date.now() - ovDelArm < 4000 ? '한 번 더 누르면 삭제' : '삭제';
  }

  // 외부 SKU · 바코드로 지난 기록 찾기 (과매입 → 옛 엑셀 → 회송)
  function ovLookup(key){
    if (ovUi.editId) return;
    const v = String(ovForm[key] || '').trim();
    const box = $('#ov-found');
    if (v.length < 5){ box.hidden = true; return; }
    const mine = (ovItems || []).filter(t => (key === 'sku' ? t.sku : t.barcode) === v).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    let hit = mine[0] ? { sku: mine[0].sku, barcode: mine[0].barcode, name: mine[0].name, vendor: mine[0].vendor } : null;
    if (!hit){ const p = OV_PAST.find(p => p[key === 'sku' ? 0 : 1] === v); if (p) hit = { sku:p[0], barcode:p[1], name:p[2], vendor:p[3] }; }
    if (!hit && key === 'barcode'){ const r = (retItems || []).find(t => t.barcode === v); if (r) hit = { sku:'', barcode:r.barcode, name:r.name, vendor:r.vendor }; }
    if (!hit){ box.hidden = true; return; }
    const canFill = !ovForm.name && !ovForm.vendor || ovUi.auto;
    if (canFill){
      for (const k of ['sku', 'barcode', 'name', 'vendor']) if (k !== key && hit[k] && (!ovForm[k] || ovUi.auto)) ovForm[k] = hit[k];
      ovUi.auto = true;
      ovFillForm();
    }
    const n = mine.length;
    box.textContent = (canFill ? '✓ 지난 기록에서 상품명 · 업체명을 채웠어요' : '✓ 지난 기록: ' + hit.name) + (n ? ` · 이 상품 과매입 ${n + 1}번째 (지난번 ${retMD(mine[0].date)} ${retNum(mine[0].qty)}개)` : '');
    box.hidden = false;
  }

  async function ovSubmit(){
    const msg = $('#ov-form-msg');
    const x = {}; for (const k of OV_FIELDS) x[k] = String(ovForm[k] ?? '').trim();
    const q = Number(x.qty.replace(/,/g, ''));
    const miss = [!x.name && '상품명', !(q > 0) && '수량', !x.vendor && '업체명'].filter(Boolean);
    if (miss.length){ msg.textContent = '필수 칸을 채워 주세요: ' + miss.join(' · '); msg.classList.add('err'); $('#ov-' + (!x.qty || !(q > 0) ? 'qty' : !x.name ? 'name' : 'vendor')).focus(); return; }
    msg.classList.remove('err');
    const payload = { ...x, qty: q, date: x.date || ovToday };
    if (ovUi.editId){
      const id = ovUi.editId, before = ovItems.find(t => t.id === id);
      const prev = { ...before };
      Object.assign(before, payload);
      ovEndEdit();
      try { const r = await api('PATCH', '/api/overs?id=' + encodeURIComponent(id), payload); Object.assign(before, r.item); ovRev = -2; toast('고쳤어요.'); }
      catch(e){ Object.assign(before, prev); renderOvers(); if (e instanceof Locked) return showLock(e.message); toast(e.message); }
      return;
    }
    const temp = { ...payload, id:'temp-' + Date.now(), status:'wait', method:'', createdAt:new Date().toISOString() };
    ovItems = [...(ovItems || []), temp];
    ovForm = { ...ovBlank(), date: payload.date, who: payload.who };
    ovUi.auto = false; $('#ov-found').hidden = true;
    renderOvers(); $('#ov-sku').focus();
    try {
      const r = await api('POST', '/api/overs', payload);
      const i = ovItems.findIndex(t => t.id === temp.id); if (i > -1) ovItems[i] = r.item;
      ovRev = -2; renderOvers(); toast('추가했어요.');
    } catch(e) {
      ovItems = ovItems.filter(t => t.id !== temp.id); renderOvers();
      if (e instanceof Locked) return showLock(e.message);
      toast(e.message);
    }
  }

  function ovStartEdit(t){
    ovUi.editId = t.id; ovDelArm = 0;
    ovForm = { sku:t.sku || '', barcode:t.barcode || '', qty: retNum(t.qty), name:t.name, vendor:t.vendor, comm:t.comm || '', mail:t.mail || '', date:t.date || ovToday, who:t.who || '' };
    ovUi.auto = false; $('#ov-found').hidden = true;
    renderOvers();
    $('#ov-form').scrollIntoView({ behavior:'smooth', block:'start' });
    setTimeout(() => $('#ov-qty').focus({ preventScroll:true }), 250);
  }
  function ovEndEdit(){
    const keep = { date: ovForm.date, who: ovForm.who };
    ovUi.editId = null; ovDelArm = 0;
    ovForm = { ...ovBlank(), ...keep, who: ovLS('ov-who', keep.who) };
    renderOvers();
  }
  async function ovDelete(){
    if (!ovDelArm || Date.now() - ovDelArm > 4000){ ovDelArm = Date.now(); ovFillForm(); setTimeout(() => { if (ovDelArm && Date.now() - ovDelArm >= 4000){ ovDelArm = 0; if (ovBuilt) ovFillForm(); } }, 4100); return; }
    const id = ovUi.editId, keep = ovItems;
    ovItems = ovItems.filter(t => t.id !== id); ovEndEdit();
    try { await api('DELETE', '/api/overs?id=' + encodeURIComponent(id)); ovRev = -2; toast('삭제했어요.'); }
    catch(e){ ovItems = keep; renderOvers(); if (e instanceof Locked) return showLock(e.message); toast(e.message); }
  }

  async function ovPatch(t, patch, okMsg){
    const prev = { ...t };
    Object.assign(t, patch);
    if (patch.status === 'done') t.doneAt = ovToday; else if (patch.status === 'wait') delete t.doneAt;
    ovRenderList(); ovRenderView(); ovFillForm();
    try { const r = await api('PATCH', '/api/overs?id=' + encodeURIComponent(t.id), patch); Object.assign(t, r.item); ovRev = -2; if (okMsg) toast(okMsg); }
    catch(e){ for (const k of Object.keys(t)) delete t[k]; Object.assign(t, prev); ovRenderList(); ovRenderView(); if (e instanceof Locked) return showLock(e.message); toast(e.message); }
  }
  const ovSetStatus = (t, s) => ovPatch(t, { status: s }, s === 'done' ? '완료했어요 · 완료 목록에서 되돌릴 수 있어요' : '대기로 되돌렸어요.');

  function ovMethodSel(t){
    const s = el('select', { class:'ov-msel m-' + (t.method || 'none'), 'aria-label':'처리방법', title:'처리방법 고르기',
      onclick: e => e.stopPropagation(), onkeydown: e => e.stopPropagation(),
      onchange: e => ovPatch(t, { method: e.target.value }, e.target.value ? ovMethod(e.target.value) + '(으)로 정했어요.' : '') },
      ...OV_METHODS.map(([k, l]) => el('option', { value:k, text: k ? l : '선택' })));
    s.value = t.method || '';
    return s;
  }

  // ---- ② 과매입 목록 (대기 · 완료) ----
  function ovRenderList(){
    const box = $('#ov-list'); if (!box) return;
    const all = ovItems || [];
    const wait = all.filter(t => t.status !== 'done'), done = all.filter(t => t.status === 'done');
    const isWait = ovUi.filter !== 'done';
    const seg = el('div', { class:'ret-view ov-filter', role:'group', 'aria-label':'상태' },
      ...[['wait', '대기', wait.length], ['done', '완료', done.length]].map(([k, l, n]) =>
        el('button', { type:'button', 'aria-pressed': (isWait ? 'wait' : 'done') === k ? 'true' : 'false', onclick: () => { ovUi.filter = k; ovRenderList(); } }, l + ' ', el('b', { text: n }))));
    const head = el('div', { class:'ret-sec-head' }, el('h3', { text:'과매입 목록' }),
      el('p', { class:'ret-help', text: isWait ? '처리방법 칸을 눌러 골라요 · 줄을 누르면 고치기' : '완료일 순 · 잘못 눌렀으면 되돌리기' }), seg);
    if (!ovItems){ box.replaceChildren(head, el('p', { class:'ret-help', text:'불러오는 중…' })); return; }
    const rows = (isWait ? wait.sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.createdAt || '').localeCompare(b.createdAt || ''))
                        : done.sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || '') || (b.date || '').localeCompare(a.date || '')));
    if (!rows.length){ box.replaceChildren(head, el('p', { class:'ho-empty', text: isWait ? '대기 중인 과매입 건이 없어요.' : '완료한 과매입 건이 없어요.' })); return; }
    const td = (cls, txt, ...kids) => el('td', { class: cls }, ...(txt != null ? [String(txt)] : []), ...kids);
    const mailCell = t => {
      if (!t.mail) return td('ov-c-mail no', '-');
      const n = ovDays(t.mail);
      return td('ov-c-mail mono', retMD(t.mail), !t.method && n >= 1 ? el('span', { class:'ov-late' + (n >= 7 ? ' hi' : ''), text: ` ${n}일` }) : null);
    };
    const thead = isWait
      ? ['외부 SKU ID', '상품 바코드', '상품명', '수량', '업체명', '생성일자', '처리자', '메일 발송일', '처리방법', '업체소통']
      : ['외부 SKU ID', '상품명', '수량', '업체명', '처리자', '처리방법', '완료일', ''];
    const body = rows.map(t => {
      const tr = el('tr', { class: t.id === ovUi.editId ? 'sel' : '', tabindex:'0', title:'눌러서 고치기',
        onclick: () => ovStartEdit(t), onkeydown: e => { if (e.key === 'Enter'){ e.preventDefault(); ovStartEdit(t); } } });
      if (isWait) tr.append(
        td('ov-c-sku mono', t.sku || '-'), td('ov-c-bc mono', t.barcode || '-'), td('ov-c-nm', t.name), td('ov-c-q mono', retNum(t.qty)),
        td('ov-c-v', t.vendor), td('ov-c-d mono', retMD(t.date)), td('ov-c-who', t.who || '-'), mailCell(t), td('ov-c-m', null, ovMethodSel(t)),
        td('ov-c-comm' + (t.comm ? '' : ' no'), t.comm || '-'),
        td('ov-c-meta', [t.sku && '외부 ' + t.sku, t.barcode, retMD(t.date) + ' 생성', t.who, t.mail ? '메일 ' + retMD(t.mail) + (!t.method && ovDays(t.mail) >= 1 ? ` (${ovDays(t.mail)}일)` : '') : '메일 전', t.comm].filter(Boolean).join(' · ')));
      else tr.append(
        td('ov-c-sku mono', t.sku || '-'), td('ov-c-nm', t.name), td('ov-c-q mono', retNum(t.qty)), td('ov-c-v', t.vendor), td('ov-c-who', t.who || '-'),
        td('ov-c-m', null, t.method ? el('span', { class:'ov-chip m-' + t.method, text: ovMethod(t.method) }) : el('span', { class:'no', text:'-' })),
        td('ov-c-d mono', retMD(t.doneAt)),
        td('ov-c-meta', [t.who, retMD(t.doneAt) + ' 완료'].filter(Boolean).join(' · ')),
        td('ov-c-act', null, el('button', { type:'button', class:'ret-btn ghost sm', text:'↩ 되돌리기', onclick: e => { e.stopPropagation(); ovSetStatus(t, 'wait'); } })));
      return tr;
    });
    box.replaceChildren(head, el('div', { class:'ov-wrap' },
      el('table', { class:'ov-t' + (isWait ? '' : ' done') }, el('thead', {}, el('tr', {}, ...thead.map(h => el('th', { class: h === '수량' ? 'r' : '', text: h })), el('th', { class:'ov-c-meta' }))), el('tbody', {}, ...body))));
  }

  // ---- ③ 처리방법별 보기 (가상반출 · 차감매입, 업체별) ----
  function ovRenderView(){
    const box = $('#ov-view'); if (!box) return;
    const wait = (ovItems || []).filter(t => t.status !== 'done');
    const by = { vr: wait.filter(t => t.method === 'vr'), ded: wait.filter(t => t.method === 'ded') };
    const k = ovUi.view, list = by[k];
    const seg = el('div', { class:'ov-tog', role:'group', 'aria-label':'처리방법' },
      ...[['vr', '가상반출'], ['ded', '차감매입']].map(([v, l]) => el('button', { type:'button', class:'m-' + v, 'aria-pressed': k === v ? 'true' : 'false',
        onclick: () => { ovUi.view = v; ovSetLS('ov-view', v); ovRenderView(); } }, l + ' ', el('b', { text: by[v].length }))));
    const groups = new Map();
    const vkey = v => String(v || '').replace(/㈜/g, '(주)').replace(/\s+/g, '');
    for (const t of [...list].sort((a, b) => (a.date || '').localeCompare(b.date || ''))){ const g = vkey(t.vendor); if (!groups.has(g)) groups.set(g, { name: t.vendor, ts: [] }); groups.get(g).ts.push(t); }
    const sumQ = list.reduce((s, t) => s + (+t.qty || 0), 0);
    const top = el('div', { class:'ov-vtop' }, seg, el('span', { class:'ret-help', text: list.length ? `업체 ${groups.size}곳 · ${retNum(sumQ)}개 · 오래된 순` : '' }));
    const head = el('div', { class:'ret-sec-head' }, el('h3', { text:'처리방법별 보기' }), el('p', { class:'ret-help', text:'대기 건 중 가상반출 · 차감매입만 · 업체별로 묶어서 봐요' }));
    if (!list.length){ box.replaceChildren(head, top, el('p', { class:'ho-empty', text: `${ovMethod(k)}(으)로 고른 대기 건이 없어요. 과매입 목록의 처리방법 칸에서 골라 주세요.` })); return; }
    const gs = [...groups.values()].map(({ name: v, ts }) => el('div', { class:'ov-g' },
      el('div', { class:'ov-gh' }, el('span', { class:'ov-gn', text: v }), el('span', { class:'ov-gc', text: `${ts.length}건 · ${retNum(ts.reduce((s, t) => s + (+t.qty || 0), 0))}개` })),
      ...ts.map(t => { const n = ovDays(t.date); return el('div', { class:'ov-r' },
        el('div', { class:'ov-rn' }, el('span', { class:'nm', text: t.name }), el('span', { class:'mt mono', text: [t.barcode || t.sku, t.who].filter(Boolean).join(' · ') })),
        el('span', { class:'ov-rq mono', text: retNum(t.qty) + '개' }),
        el('span', { class:'ov-rd mono' + (n >= 7 ? ' hi' : ''), text: n + '일째' }),
        el('button', { type:'button', class:'ov-done', text:'✓ 완료', onclick: () => ovSetStatus(t, 'done') })); })));
    box.replaceChildren(head, top, el('div', { class:'ov-gs' }, ...gs));
  }

  // ---------- 생산성 (STOW 개인 UPH) ----------
  // WMS 작업자 이력(worker_history) 엑셀을 이 브라우저에서만 읽어요. 서버에는 아무것도 저장하지 않아요.
  const PR_TOTE = new Set(['11F', '21F', '31F']);        // 토트 재고이동 (챔버는 '프리팩')
  const PR_TYPES = ['PLT', 'CASE', 'EACH', 'TOTE'];
  const PR_TYPE_LABEL = { PLT:'PLT', CASE:'CASE', EACH:'EACH', TOTE:'토트 재고이동', ETC:'기타' };
  const PR_TYPE_SHORT = { PLT:'PLT', CASE:'CASE', EACH:'EACH', TOTE:'토트', ETC:'기타' };
  const PR_COLOR = { PLT:'#2a78d6', CASE:'#eb6834', EACH:'#1baf7a', TOTE:'#4a3aa7', ETC:'#9AA5A1' };
  const PR_SHIFT = { day:'주간', eve:'오후', night:'심야' };
  const PR_PROC = { 'Receive_Shrink Packaging':'쉬링크 포장', TRANSFER_CART_UNLOAD:'카트 하차', RECEIVE_WS:'입고', UNLOAD_WS:'하차', UNLOAD:'하차',
    IB_TEAM_CAPTAIN:'캡틴', FORKLIFTER:'지게차', REPLENISHER:'보충', STOW_WS:'STOW_WS' };
  // 관리자 (이름으로 구분) · 나머지는 계약직(PERM) / 단기(TEMP)
  const PR_MGR = new Set(['윤주봉', '박주영', '김민지', '최재준', '송종은', '김균현', '신준희', '김형남']);
  const prRole = (emp, ct) => PR_MGR.has(prName(emp).trim()) ? 'mgr' : String(ct).toUpperCase() === 'TEMP' ? 'temp' : 'perm';
  const PR_ROLE = { mgr:'관리자', perm:'계약직', temp:'단기' };
  const prRoleTag = (emp, ct) => { const r = prRole(emp, ct); return el('span', { class:'pr-tag role-' + r, text: PR_ROLE[r] }); };
  let prData = null, prRev = -1, prLoading = false;
  const prUi = { shift:'all', type:'all', ct:'all', sel:'', sort:'q', ciScope:'ib' };

  const prSec = v => {

  // 엑셀 줄 → 필요한 칸만 뽑아 두기

    const hi = rows.findIndex(r => r && r.includes('Employee') && r.some(v => /^Process/.test(v || '')));
    if (hi < 0) throw new Error("'Employee' · 'Process(Task)' 열을 찾지 못했어요. WMS 작업자 이력(worker_history) 엑셀인지 확인해 주세요.");
