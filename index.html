  // 차감매입 대기 목록 인쇄 (업체별로 묶어서, A4)
  function ovPrintDed(groups, sumQ){
    const E = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
    const now = new Date(Date.now() + 9 * 36e5).toISOString();
    const stamp = now.slice(5, 10) + ' ' + now.slice(11, 16);
    const n = groups.reduce((s, g) => s + g.ts.length, 0);
    const body = groups.map(g => `<tbody><tr class="gh"><td colspan="8">${E(g.name || '(업체 없음)')}<span>${g.ts.length}건 · ${E(retNum(g.ts.reduce((s, t) => s + (+t.qty || 0), 0)))}개</span></td></tr>`
      + g.ts.map(t => `<tr><td class="m">${E(t.date ? retMD(t.date) : '-')}</td><td class="m">${E(t.sku || '')}</td><td class="m">${E(t.barcode || '')}</td><td>${E(t.name || '')}</td><td class="m r b">${E(retNum(t.qty))}</td><td>${E(t.who || '')}</td><td class="m">${E(t.mail ? retMD(t.mail) : '')}</td><td class="c">${E(t.comm || '')}</td></tr>`).join('') + '</tbody>').join('');
    const css = `@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}body{margin:0;color:#111;font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1{font-size:18pt;margin:0 0 1mm}.sub{font-size:9pt;color:#555;margin-bottom:3mm}table{width:100%;border-collapse:collapse;font-size:9.5pt}th{text-align:left;font-size:8.5pt;color:#555;border-bottom:.4mm solid #111;padding:1.2mm}
td{padding:1.2mm;border-bottom:.2mm solid #ccc;vertical-align:middle}tr{break-inside:avoid}thead{display:table-header-group}tbody{break-inside:avoid-page}.m{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}.r{text-align:right}.b{font-weight:800}.c{font-size:8.5pt;color:#333}
tr.gh td{background:#eef1f0;font-weight:800;font-size:10.5pt;border-bottom:.3mm solid #111;padding-top:2mm}tr.gh span{float:right;font-weight:600;font-size:9pt;color:#444}`;
    const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>차감매입 대기 목록</title><style>${css}</style></head><body>
<h1>과매입 · 차감매입 대기</h1><div class="sub">업체 ${groups.length}곳 · ${n}건 · ${E(retNum(sumQ))}개 · 오래된 순 · 인쇄 ${stamp}</div>
<table><thead><tr><th>생성일자</th><th>외부 SKU</th><th>바코드</th><th>상품명</th><th class="r">수량</th><th>처리자</th><th>메일 발송</th><th>비고</th></tr></thead>${body}</table></body></html>`;
    document.getElementById('ov-print-frame')?.remove();
    const f = el('iframe', { id:'ov-print-frame', title:'차감매입 인쇄', 'aria-hidden':'true', style:'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden' });
    document.body.append(f);
    const d = f.contentDocument; d.open(); d.write(html); d.close();
    setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch { toast('인쇄 화면을 열지 못했어요.'); } }, 300);
  }

  // ---------- 공통: ✎ 수정 → 그 줄 아래 수정 칸 · 칸을 두 번 누르면 바로 수정 ----------
  function qEdit(host, cur, o, save, cancel){
    if (!host || host.classList.contains('ie')) return;
    window.getSelection?.().removeAllRanges();
    const inp = el('input', { class:'qe-in', type: o.type || 'text', inputmode: o.im, maxlength: o.max || 150, autocomplete:'off', 'aria-label': o.label });
    inp.value = cur == null ? '' : String(cur);
    let done = false;
    const fin = ok => { if (done) return; done = true; const v = inp.value.trim(); if (ok && v !== String(cur ?? '').trim()) save(v); else cancel(); };
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === 'Enter'){ e.preventDefault(); fin(true); } else if (e.key === 'Escape'){ e.preventDefault(); fin(false); } };
    inp.onblur = () => fin(true);
    inp.onclick = e => e.stopPropagation();
    host.classList.add('ie'); host.replaceChildren(inp);
    inp.focus(); if (inp.type === 'text') inp.select();
  }

  async function ovSaveInl(t){

  const OV_PDF_MAX = 4 * 1024 * 1024;

  const ovFileSize = n => n >= 1048576 ? (Math.round(n / 104857.6) / 10) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';

  async function ovUploadFiles(t, list){
    list = list.filter(Boolean); if (!list.length) return;
    if (String(t.id).startsWith('temp-')) return toast('저장 중이에요. 잠시 후 다시 해 주세요.');
    const isPdf = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    const bad = list.filter(f => !isPdf(f)), big = list.filter(f => isPdf(f) && f.size > OV_PDF_MAX);
    if (bad.length) toast('PDF 파일만 올릴 수 있어요: ' + bad.map(f => f.name).join(', '));
    else if (big.length) toast('4MB가 넘어서 못 올려요: ' + big.map(f => f.name).join(', '));
    const ok = list.filter(f => isPdf(f) && f.size <= OV_PDF_MAX && f.size > 0);
    if (!ok.length) return;
    ovUi.upl = { id: t.id, done: 0, total: ok.length }; ovRerender();
    let fails = 0;
    for (const f of ok){
      pending++; setSync('busy', 'PDF 올리는 중…');
      try {
        const q = `id=${encodeURIComponent(t.id)}&name=${encodeURIComponent(f.name)}&who=${encodeURIComponent(ovLS('ov-who', ''))}`;
        const r = await fetch('/api/files?' + q, { method:'POST', headers: ovFileHeaders({ 'Content-Type':'application/pdf' }), body: f });
        const d = await r.json().catch(() => ({}));
        if (r.status === 401) throw new Locked(d.error || '팀 비밀번호를 입력하세요.');
        if (!r.ok) throw new Error(d.error || '올리지 못했어요.');
        if (d.item) t.files = d.item.files || [];
        ovUi.upl.done++; ovRev = -2;
      } catch(e){
        if (e instanceof Locked){ pending--; ovUi.upl = null; ovRerender(); return showLock(e.message); }
        fails++; toast(`${f.name}: ${e.message}`);
      } finally { if (ovUi.upl) pending--; }
      ovRerender();
    }
    ovUi.upl = null; ovRerender(); ovRenderList(); ovRenderView();
    setSync(fails ? 'err' : '', fails ? '일부 파일을 올리지 못했어요' : '저장됨');
    if (!fails) toast(ok.length > 1 ? `PDF ${ok.length}개를 올렸어요.` : 'PDF를 올렸어요.');
  }
  async function ovOpenFile(t, f){

  async function obSaveGroup(){
    const d = obUi.draft; if (!d) return;
    const trim = v => String(v ?? '').replace(/\t/g, ' ').trim();
    const num = v => v === '' ? '' : Number(String(v).replace(/,/g, ''));
    const C = Object.fromEntries(Object.entries(d.common).map(([k, v]) => [k, trim(v)]));
    const fail = m => { d.msg = m; d.msgErr = true; obRenderList(); };
    const live = d.rows.filter(r => !r.del && (r.id || OB_ROWF.some(k => trim(r[k]))));
    for (const r of live){
      for (const k of ['qty', 'box']) if (trim(r[k]) && !Number.isFinite(Number(trim(r[k]).replace(/,/g, '')))) return fail((k === 'qty' ? '수량' : '박스') + '은 숫자로 적어 주세요.');
      if (!C.grp && !C.vendor && !trim(r.name)) return fail('반출그룹번호 · 업체명 · 상품명 중 하나는 적어 주세요.');
    }
    if (d.rows.some(r => String(r.id || '').startsWith('temp-'))) return fail('저장 중이에요. 잠시 후 다시 눌러 주세요.');
    const patches = [], del = [], add = [];
    for (const r of d.rows){
      if (r.id && r.del){ del.push(r.id); continue; }
      const x = { ...C, ...Object.fromEntries(OB_ROWF.map(k => [k, trim(r[k])])) };
      if (!r.id){ if (OB_ROWF.some(k => x[k])) add.push({ ...x, stage: d.stage, com2: d.com2, com3: d.com3 }); continue; }
      const t = (obItems || []).find(v => v.id === r.id); if (!t) continue;
      const patch = {}; for (const [k, v] of Object.entries(x)) if (String(t[k] ?? '') !== String(v)) patch[k] = v;
      if (Object.keys(patch).length) patches.push({ id: r.id, ...patch });
    }
    if (!patches.length && !del.length && !add.length){ obCloseGroup(); toast('바뀐 내용이 없어요.'); return; }
    // 화면 먼저 바꾸고, 저장은 요청 한 번으로 뒤에서 — 실패하면 통째로 되돌려요
    const snap = (obItems || []).map(t => ({ ...t }));
    for (const p of patches){ const t = obItems.find(v => v.id === p.id); if (t){ Object.assign(t, p); for (const k of ['qty', 'box']) if (k in p) t[k] = num(p[k]); } }
    obItems = obItems.filter(t => !del.includes(t.id));
    const now = Date.now();
    const temps = add.map((x, i) => ({ ...x, qty: num(x.qty), box: num(x.box), id: `temp-${now}-${i}`, createdAt: new Date(now + i).toISOString() }));
    obItems.push(...temps);
    obUi.draft = null; obUi.delArm = 0; obRenderList(); istCounts(); toast('저장했어요.');
    try {
      const r = await api('PUT', '/api/outs', { items: patches, del, add });
      for (const it of r.items || []){ const t = obItems.find(v => v.id === it.id); if (t) Object.assign(t, it); }
      obItems = obItems.filter(t => !temps.includes(t)).concat(r.added || []);
      obRev = -2; setSync('', '저장됨'); obRenderList(); istCounts();
    } catch(e){ obItems = snap; obRenderList(); istCounts(); if (e instanceof Locked) return showLock(e.message); toast(e.message + ' (저장 안 됨)'); }
  }
  async function obDeleteGroup(){
    const d = obUi.draft; if (!d) return;
    if (!obUi.delArm || Date.now() - obUi.delArm > 4000){ obUi.delArm = Date.now(); obRenderList(); setTimeout(() => { if (obUi.delArm && Date.now() - obUi.delArm >= 4000){ obUi.delArm = 0; obRenderList(); } }, 4100); return; }
    const ids = d.rows.map(r => r.id).filter(id => id && !String(id).startsWith('temp-'));
    const snap = obItems;
    obItems = obItems.filter(t => !ids.includes(t.id)); obUi.draft = null; obUi.delArm = 0; obRenderList(); istCounts(); toast('그룹을 삭제했어요.');
    try { await api('PUT', '/api/outs', { del: ids }); obRev = -2; setSync('', '저장됨'); }
    catch(e){ obItems = snap; obRenderList(); istCounts(); if (e instanceof Locked) return showLock(e.message); toast(e.message + ' (삭제 안 됨)'); }
  }

table{border-collapse:collapse;width:100%;font-size:${many ? 9.5 : 11.5}pt;table-layout:fixed}th{text-align:left;font-size:9pt;color:#555;border-bottom:.4mm solid #111;padding:1mm;white-space:nowrap}
td{padding:0 1mm;height:${rowH}mm;border-bottom:.2mm dashed #999;vertical-align:middle}td.nm{overflow-wrap:anywhere;line-height:1.25}td.bc{font-family:ui-monospace,Menlo,Consolas,monospace;width:34mm}
.q{width:15mm;text-align:right}td.q{font-weight:900;font-size:${many ? 11 : 14}pt}.ex{width:38mm;text-align:center}td.ex div{border:.35mm solid #111;border-radius:1mm;height:${Math.max(5, rowH - 3)}mm}
.ad{margin-top:auto;font-size:12pt;line-height:1.4;border-top:.4mm solid #111;padding-top:3mm;overflow-wrap:anywhere}.ad b{font-family:ui-monospace,Menlo,Consolas,monospace}.ft{display:flex;justify-content:space-between;font-size:9pt;color:#555}`;
    const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>반출 라벨 ${E(g.grp || g.vendor || '')}</title><style>${css}</style></head><body>${Array.from({ length: n }, (_, i) => one(i + 1)).join('')}</body></html>`;

    setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch { toast('인쇄 화면을 열지 못했어요.'); } }, 300);

  const prRole = (emp, ct) => PR_MGR.has(prName(emp).trim()) ? 'mgr' : String(ct).toUpperCase() === 'TEMP' ? 'temp' : 'perm';
  const PR_ROLE = { mgr:'관리자', perm:'계약직', temp:'단기' };
  const prRoleTag = (emp, ct) => { const r = prRole(emp, ct); return el('span', { class:'pr-tag role-' + r, text: PR_ROLE[r] }); };
  // ---- 프리팩: WMS 재고 엑셀 → 식빵 · 깻잎 · SR · Egg 로 나눠 유통기한 빠른 순 ----
  const PP_CATS = [['bread', '식빵'], ['perilla', '깻잎'], ['sr', 'SR'], ['egg', 'Egg'], ['etc', '분류 안 됨']];
  const ppCatName = k => (PP_CATS.find(c => c[0] === k) || ['', k])[1];
  let ppData = null, ppRev = -1, ppLoading = false;
  const ppUi = { cat: store.get('pp-cat', '') };
  const ppTodayIso = () => new Date(Date.now() + 9 * 36e5).toISOString().slice(0, 10);
  // 상품명으로 분류 (위에서부터 먼저 맞는 것)
  function ppCat(name){
    const n = String(name || '').replace(/ /g, ' ');
    if (n.includes('식빵')) return 'bread';
    if (n.includes('깻잎')) return 'perilla';
    if (/\[\s*SR\s*\]/i.test(n)) return 'sr';
    if (/\d+\s*구(?!이)/.test(n) || /(^|[^\d])(10|15)\s*P(?![a-z])/i.test(n)) return 'egg';
    return 'etc';
  }
  // 엑셀 날짜 칸: 엑셀 날짜 숫자 · '2026-10-21' · '2026.10.21' 모두 → 'YYYY-MM-DD'
  function ppDay(v){
    const t = String(v ?? '').trim();
    if (!t) return '';
    if (/^\d+(\.\d+)?$/.test(t)){ const n = parseFloat(t); if (n < 20000 || n > 80000) return ''; return new Date(Math.round((Math.floor(n) - 25569) * 864e5)).toISOString().slice(0, 10); }
    const m = t.match(/(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
    return m ? `${m[1]}-${pad(+m[2])}-${pad(+m[3])}` : '';
  }
  const ppDays = iso => iso ? Math.round((Date.parse(iso) - Date.parse(ppTodayIso())) / 864e5) : null;
  const ppMD = iso => { if (!iso) return '-'; const [y, m, d] = iso.split('-'); return (y === ppTodayIso().slice(0, 4) ? '' : y + '/') + (+m) + '/' + (+d); };
  const ppDD = d => d == null ? '-' : d < 0 ? `D+${-d}` : d === 0 ? 'D-DAY' : `D-${d}`;
  const ppLvl = d => d == null ? '' : d <= 7 ? ' over' : d <= 14 ? ' warn' : '';
  const ppShort = s => String(s || '').replace(/^\s*\[로켓프레시\]\s*/, '').trim();
  const ppSort = (a, b) => (a.exp || '9999').localeCompare(b.exp || '9999') || a.name.localeCompare(b.name, 'ko') || a.loc.localeCompare(b.loc);

  function ppPrep(rows, file){
    const norm = s => String(s || '').replace(/\s/g, '');
    const hi = rows.findIndex(r => r && r.some(v => norm(v) === '상품명') && r.some(v => norm(v) === '유통기한'));
    if (hi < 0) throw new Error("'상품명' · '유통기한' 열을 찾지 못했어요. WMS 재고(인벤토리) 엑셀인지 확인해 주세요.");
    const H = rows[hi].map(norm);
    const col = { loc: H.indexOf('로케이션'), name: H.indexOf('상품명'), q: H.indexOf('수량'), mfg: H.indexOf('제조일'), exp: H.indexOf('유통기한'),
      sku: H.indexOf('SKUID'), bc: H.indexOf('상품바코드'), lpn: H.indexOf('LPN') };
    const miss = [['loc', '로케이션'], ['q', '수량']].filter(([k]) => col[k] < 0).map(x => x[1]);
    if (miss.length) throw new Error('엑셀에 이 열이 없어요: ' + miss.join(', '));
    const g = (r, k) => col[k] >= 0 ? String(r[col[k]] ?? '').replace(/ /g, ' ').trim() : '';
    const out = [];
    for (const r of rows.slice(hi + 1)){
      if (!r || !r.some(v => String(v ?? '').trim())) continue;
      const name = g(r, 'name');
      if (!name) continue;
      const q = parseFloat(g(r, 'q').replace(/,/g, ''));
      out.push({ c: ppCat(name), loc: g(r, 'loc'), name, q: isNaN(q) ? 0 : q, mfg: ppDay(r[col.mfg]), exp: ppDay(r[col.exp]),
        sku: ppId(g(r, 'sku')), bc: ppId(g(r, 'bc')), lpn: ppId(g(r, 'lpn')) });
    }
    if (!out.length) throw new Error('엑셀에 상품 줄이 없어요.');
    return { file, total: out.length, rows: out.sort(ppSort), at: 0 };
  }
  // 엑셀이 숫자로 저장한 번호(1.58824187E8 · 198644197.0)를 원래 글자로
  const ppId = v => { const t = String(v || '').trim(); if (/^\d+(\.\d+)?(e\+?\d+)?$/i.test(t)){ const n = Number(t); if (Number.isSafeInteger(n)) return String(n); } return t; };
  const ppEncode = D => ({ file: D.file, total: D.total, rows: D.rows.map(r => [r.c, r.loc, r.name, r.q, r.mfg, r.exp, r.sku, r.bc, r.lpn]) });
  const ppDecode = S => ({ file: S.file || '', total: S.total || 0, at: S.at || 0,
    rows: (S.rows || []).map(([c, loc, name, q, mfg, exp, sku, bc, lpn]) => ({ c, loc, name, q, mfg, exp, sku, bc, lpn })).sort(ppSort) });

  async function ppLoad(){
    if (ppLoading) return;
    ppLoading = true;
    try {
      const d = await request('GET', '/api/prepack');
      ppRev = d.rev;
      if (d.snap && d.snap.at !== ppData?.at){ ppData = ppDecode(d.snap); if (view === 'pp') renderPrepack(); }
      else if (!d.snap && view === 'pp' && !$('#pp').hasChildNodes()) renderPrepack();
    } catch(e) {
      if (e instanceof Locked) return showLock(e.message);
    } finally { ppLoading = false; }
  }
  function ppPick(){
    const inp = el('input', { type:'file', accept:'.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    inp.onchange = () => { if (inp.files[0]) ppImportFile(inp.files[0]); };
    inp.click();
  }
  function ppDropZone(node){
    node.ondragover = e => { e.preventDefault(); node.classList.add('drag'); };
    node.ondragleave = e => { if (!node.contains(e.relatedTarget)) node.classList.remove('drag'); };
    node.ondrop = e => { e.preventDefault(); node.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) ppImportFile(f); };
  }
  async function ppImportFile(file){
    try {
      toast('엑셀을 읽는 중이에요…');
      ppData = ppPrep(await hoReadXlsx(file), file.name);
      renderPrepack();
    } catch(e) { return toast(e.message || '엑셀을 읽지 못했어요.'); }
    try {
      const r = await api('PUT', '/api/prepack', { snap: ppEncode(ppData) });
      ppData.at = r.at; ppRev = r.rev; renderPrepack();
      setSync('', '저장됨');
      toast(`${ppData.total}건을 나눠서 팀 모두에게 공유했어요.`);
    } catch(e) {
      if (e instanceof Locked) return showLock(e.message);
      setSync('err', '공유 저장을 못 했어요');
      toast('분류는 됐지만 공유 저장을 못 했어요: ' + (e.message || ''));
    }
  }

  function renderPrepack(){
    const box = $('#pp');
    const upBtn = () => el('button', { type:'button', class:'ret-btn sm ghost', onclick: ppPick, title:'새 WMS 재고 엑셀로 바꾸기' }, '⬆ 새 파일 올리기');
    const when = ppData?.at ? new Date(ppData.at).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' }) + ' 올림' : '';
    const head = el('div', { class:'ret-sec-head' }, el('h3', { text:'프리팩' }),
      el('span', { class:'ret-help', text: ppData ? [ppData.file, when].filter(Boolean).join(' · ') : '식빵 · 깻잎 · SR · Egg 를 유통기한 빠른 순으로 보여줘요' }),
      ppData ? el('span', { class:'pp-up' }, upBtn()) : null);
    const sec = el('section', { class:'ret-sec pp' }, head);
    ppDropZone(sec);
    if (!ppData){
      const drop = el('div', { class:'pr-drop', tabindex:'0', role:'button', 'aria-label':'엑셀 올리기', onclick: ppPick,
        onkeydown: e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ppPick(); } } },
        el('b', { text:'WMS 재고 엑셀 올리기' }), el('span', { text:'엑셀 파일을 끌어다 놓거나 눌러서 고르세요' }),
        el('small', { text:'분류한 결과는 팀 모두에게 보이고, 새 파일을 올리면 바뀌어요' }));
      sec.append(drop);
      box.replaceChildren(sec);
      return;
    }
    const by = {}; for (const [k] of PP_CATS) by[k] = [];
    for (const r of ppData.rows) (by[r.c] || by.etc).push(r);
    const cats = PP_CATS.filter(([k]) => k !== 'etc' || by.etc.length);
    let cur = ppUi.cat;
    if (!cats.some(([k]) => k === cur) || (!by[cur].length && cats.some(([k]) => by[k].length))) cur = (cats.find(([k]) => by[k].length) || cats[0])[0];
    const cards = el('div', { class:'pp-cards' }, ...cats.map(([k, label]) => {
      const L = by[k], n = L.length;
      const first = L.find(r => r.exp), d = first ? ppDays(first.exp) : null;
      const qty = L.reduce((s, r) => s + (r.q || 0), 0);
      return el('button', { type:'button', class:'pp-card' + (k === cur ? ' on' : '') + (n ? '' : ' empty') + (k === 'etc' ? ' etc' : ''), 'aria-pressed': k === cur ? 'true' : 'false',
        onclick: () => { ppUi.cat = k; store.set('pp-cat', k); renderPrepack(); } },
        el('b', { text: label }),
        el('span', { class:'n' }, String(n), el('small', { text:'건' }), n ? ' · ' + qty.toLocaleString('ko-KR') : '', n ? el('small', { text:'개' }) : null),
        el('span', { class:'dd' + (n ? ppLvl(d) : ''), text: !n ? '이번 파일에 없음' : first ? `가장 빠른 ${ppMD(first.exp)} · ${ppDD(d)}` : '유통기한 없음' }));
    }));
    const L = by[cur];
    const tools = el('span', { class:'pp-tools' },
      el('button', { type:'button', class:'ret-btn sm ghost', disabled: !L.length, title:'이 목록 인쇄', onclick: () => ppPrint(cur, L) }, '🖨 인쇄'),
      el('button', { type:'button', class:'ret-btn sm ghost', disabled: !L.length, title:'이 목록을 엑셀로 받기', onclick: () => ppExport(cur, L) }, '⬇ 엑셀'));
    const sub = el('div', { class:'pp-sub' }, el('h4', {}, ppCatName(cur), el('span', { text: ` · ${L.length}건 · 유통기한 빠른 순` + (cur === 'egg' ? ' · 10구·15구 함께' : '') })), tools);
    let body;
    if (!L.length) body = el('p', { class:'ret-help pp-none', text: cur === 'etc' ? '' : `이번 파일에는 ${ppCatName(cur)} 상품이 없어요.` });
    else {
      // 같은 유통기한끼리 묶고, 묶음 배경을 번갈아 칠해서 경계가 보이게 (급한 정도는 D-day 배지 색)
      const groups = [];
      for (const r of L){ const g = groups[groups.length - 1]; if (g && g.exp === r.exp) g.rows.push(r); else groups.push({ exp: r.exp, rows: [r] }); }
      body = el('div', { class:'pp-scroll pp-list' },
        el('div', { class:'pp-hd' }, el('span', { text:'유통기한' }), el('span', { text:'로케이션' }), el('span', { text:'상품명' }), el('span', { text:'상품바코드' }), el('span', { class:'r', text:'수량' })),
        ...groups.map((g, i) => { const d = ppDays(g.exp), q = g.rows.reduce((s, r) => s + (r.q || 0), 0);
          return el('div', { class:'pp-day' + (i % 2 ? ' alt' : '') },
            el('div', { class:'pp-dh' }, el('b', { class:'dt', text: g.exp ? ppMD(g.exp) : '없음' }), el('span', { class:'pp-dd' + ppLvl(d), text: ppDD(d) }),
              el('small', { text:`${g.rows.length}건 · ${q.toLocaleString('ko-KR')}개` })),
            el('div', { class:'pp-dl' }, ...g.rows.map(r => el('div', { class:'pp-rw' },
              el('span', { class:'loc', text: r.loc || '-' }),
              el('span', { class:'nm', title: r.name, text: ppShort(r.name) }),
              el('span', { class:'bc', text: r.bc || '-' }),
              el('b', { class:'q', text: retNum(r.q) }))))); }));
    }
    sec.append(cards, sub, body);
    if (by.etc.length && cur !== 'etc') sec.append(el('p', { class:'ret-help', text:`분류에 안 맞는 상품 ${by.etc.length}건은 '분류 안 됨' 카드에서 볼 수 있어요.` }));
    box.replaceChildren(sec);
  }

  function ppPrint(cat, L){
    const E = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
    const now = new Date(Date.now() + 9 * 36e5).toISOString();
    const stamp = now.slice(5, 10) + ' ' + now.slice(11, 16);
    const qty = L.reduce((s, r) => s + (r.q || 0), 0);
    const rows = L.map(r => { const d = ppDays(r.exp); return `<tr><td class="m">${E(r.loc)}</td><td>${E(ppShort(r.name))}</td><td class="m">${E(r.bc)}</td><td class="m r b">${E(retNum(r.q))}</td><td class="m b">${E(ppMD(r.exp))}</td><td class="dd r${ppLvl(d)}">${ppDD(d)}</td></tr>`; }).join('');
    const css = `@page{size:A4;margin:10mm}*{box-sizing:border-box}body{margin:0;color:#111;font-family:-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1{font-size:18pt;margin:0 0 1mm}.sub{font-size:9pt;color:#555;margin-bottom:3mm}table{width:100%;border-collapse:collapse;font-size:9.5pt}th{text-align:left;font-size:8.5pt;color:#555;border-bottom:.4mm solid #111;padding:1.2mm}
td{padding:1.2mm;border-bottom:.2mm solid #ccc;vertical-align:middle}tr{break-inside:avoid}thead{display:table-header-group}.m{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}.r{text-align:right}.b{font-weight:800}
.dd{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;white-space:nowrap}.dd.over{color:#c0392b}.dd.warn{color:#b8661a}`;
    const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>프리팩 ${E(ppCatName(cat))}</title><style>${css}</style></head><body>
<h1>프리팩 · ${E(ppCatName(cat))}</h1><div class="sub">${L.length}건 · ${E(qty.toLocaleString('ko-KR'))}개 · 유통기한 빠른 순 · ${E(ppData.file || '')} · 인쇄 ${stamp}</div>
<table><thead><tr><th>로케이션</th><th>상품명</th><th>상품바코드</th><th class="r">수량</th><th>유통기한</th><th class="r">D-day</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;
    document.getElementById('pp-print-frame')?.remove();
    const f = el('iframe', { id:'pp-print-frame', title:'프리팩 인쇄', 'aria-hidden':'true', style:'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden' });
    document.body.append(f);
    const d = f.contentDocument; d.open(); d.write(html); d.close();
    setTimeout(() => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch { toast('인쇄 화면을 열지 못했어요.'); } }, 300);
  }

  // 아주 작은 .xlsx 만들기 (외부 라이브러리 없이, 압축 없는 zip)
  function ppXlsx(sheet, rows, widths){
    const X = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
    const colName = i => { let s = ''; i++; while (i){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
    // 칸 값은 그냥 값이거나 { v, s:{ b, color, fill, align, border, top, num } } (음영 · 굵게 · 테두리)
    const fonts = [], fills = ['<fill><patternFill patternType="none"/></fill>', '<fill><patternFill patternType="gray125"/></fill>'], borders = ['<border/>'], xfs = [];
    const idx = (arr, x) => { let i = arr.indexOf(x); if (i < 0){ arr.push(x); i = arr.length - 1; } return i; };
    const line = (st, c) => `style="${st}"><color rgb="FF${c}"/>`;
    const sty = o => {
      o = o || {};
      const f = idx(fonts, `<font>${o.b ? '<b/>' : ''}<sz val="10"/>${o.color ? `<color rgb="FF${o.color}"/>` : ''}<name val="맑은 고딕"/></font>`);
      const fi = o.fill ? idx(fills, `<fill><patternFill patternType="solid"><fgColor rgb="FF${o.fill}"/></patternFill></fill>`) : 0;
      const bo = o.border ? idx(borders, `<border><left ${line('thin', 'D4D4D4')}</left><right ${line('thin', 'D4D4D4')}</right><top ${o.top ? line('medium', '6B8F84') : line('thin', 'D4D4D4')}</top><bottom ${line('thin', 'D4D4D4')}</bottom><diagonal/></border>`) : 0;
      const al = o.align ? `<alignment horizontal="${o.align}" vertical="center"/>` : '';
      return idx(xfs, `<xf numFmtId="${o.num ? 3 : 0}" fontId="${f}" fillId="${fi}" borderId="${bo}" applyFont="1"${fi ? ' applyFill="1"' : ''}${bo ? ' applyBorder="1"' : ''}${o.num ? ' applyNumberFormat="1"' : ''}${al ? ` applyAlignment="1">${al}</xf>` : '/>'}`);
    };
    sty(null);
    const HEAD = { b:1, color:'FFFFFF', fill:'1F6F5C', align:'center', border:1 };
    const cell = (v, r, c, st) => { if (v && typeof v === 'object'){ st = sty(v.s); v = v.v; } else if (r === 0) st = sty(HEAD); else st = 0;
      const ref = colName(c) + (r + 1), s = st ? ` s="${st}"` : '';
      return typeof v === 'number' && isFinite(v) ? `<c r="${ref}"${s}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${s}><is><t xml:space="preserve">${X(v)}</t></is></c>`; };
    const sheetXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>`
      + `<cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>`
      + rows.map((r, ri) => `<row r="${ri + 1}"${ri === 0 ? ' ht="20" customHeight="1"' : ''}>${r.map((v, ci) => cell(v, ri, ci)).join('')}</row>`).join('')
      + `</sheetData><autoFilter ref="A1:${colName(rows[0].length - 1)}${rows.length}"/></worksheet>`;
    const files = [
      ['[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],
      ['_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${X(sheet)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${X(sheet)}'!$A$1:$${colName(rows[0].length - 1)}$${rows.length}</definedName></definedNames></workbook>`],
      ['xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],

    view = b.dataset.s; store.set('todo-view2', view); store.set('ist-sub', view);
    render();
    if (view === 'ret') loadReturns(); else if (view === 'over') loadOvers(); else loadOuts();
  });
  function istCounts(){
    const r = retItems ? retItems.filter(t => t.status !== 'done').length : null;
    const o = ovItems ? ovItems.filter(t => t.status !== 'done').length : null;
    $('#istCntRet').textContent = r == null ? '' : '대기 ' + r;
    $('#istCntOver').textContent = o == null ? '' : '대기 ' + o;
    const g = obItems ? new Set(obItems.filter(t => (t.stage || 1) < 4).map(t => obKey(t))).size : null;
    $('#istCntOut').textContent = g == null ? '' : '진행 ' + g;
  }
  function enterEdit(){ askEdit = false; editMode = true; render(); const el = $('#add-day'); if (el) el.focus(); }
  $('#editToggle').onclick = () => {
    if (editMode) { editMode = false; render(); return; }
    if (editKey) return enterEdit();
    askEdit = !askEdit; $('#editErr').textContent = ''; render();
    if (askEdit) $('#editPw').focus();
  };
  $('#editCancel').onclick = () => { askEdit = false; $('#editPw').value = ''; render(); };
  $('#editLock').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('#editPw').value.trim();
    if (!pw) return $('#editPw').focus();
    setEditKey(pw);
    try {
      await request('GET', '/api/shifts?verify=1');
      $('#editPw').value = ''; $('#editErr').textContent = '';
      enterEdit();
    } catch(err) {
      setEditKey('');
      if (err instanceof Locked) return showLock(err.message);
      $('#editErr').textContent = err.message; $('#editPw').select();
    }
  });
  function goMonth(delta){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+delta, 1); render(); loadFull(); }
  $('#calPrev').onclick = () => goMonth(-1);
  $('#calNext').onclick = () => goMonth(1);
  $('#calToday').onclick = () => { selDate = todayIso; calMonth = new Date(now.getFullYear(), now.getMonth(), 1); $('#newDue').value = todayIso; render(); if (monthsNeeded() !== loadedMonths) loadFull(); };
  $('#clearDone').onclick = () => mutate(() => { items = items.filter(t=>!t.done); }, () => api('DELETE', '/api/todos?done=1'));

  $('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('#lockPw').value;
    if (!pw) return $('#lockPw').focus();
    teamKey = pw;
    try {
      await request('GET', '/api/state?only=rev');
      store.set('team-key', pw);
      $('#lock').hidden = true; $('#app').hidden = false; $('#lockPw').value = '';
      loadFull();
    } catch(err) {
      teamKey = ''; store.del('team-key');
      $('#lockErr').textContent = err instanceof Locked ? '비밀번호가 틀렸어요. 다시 입력하세요.' : err.message;
    }
  });

  if (view === 'cal') $('#newDue').value = selDate;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  setInterval(poll, POLL_MS);
  render();
  loadFull();
})();
</script>
</body>
</html>
