        el('tbody', {}, el('tr', {}, el('th', { scope:'row', text:'수량' }), ...HO_PP.map(([k, l]) => {
          const f = `ppq:${k}`;
          const n = el('input', { class:'ho-num', 'aria-label': `프리팩 ${l} 수량`, maxlength: 20, value: d[f] ?? '' });
          n.onchange = () => { n.value = n.value.trim(); if (n.value) d[f] = n.value; else delete d[f]; hoSave('day', f, n.value); };
          return el('td', {}, n);
        })))))));
    // NYS·NYR (XD·RC·RM) — 합계와 Total은 자동 계산
    const nySum = {};
    const nyRowSum = rk => { let t = 0, any = false; for (const [ck] of HO_NY_COLS){ const v = parseFloat(d[`ny:${rk}:${ck}`]); if (!isNaN(v)){ t += v; any = true; } } return any ? Math.round(t * 10) / 10 : null; };
    const nyTotalCell = el('td', { class:'ho-ny-total' });
    const nyUpdate = () => {
      let t = 0, any = false;
      for (const [rk] of HO_NY_ROWS){ const v = nyRowSum(rk); nySum[rk].textContent = v === null ? '–' : String(v); if (v !== null){ t += v; any = true; } }
      nyTotalCell.textContent = any ? String(Math.round(t * 10) / 10) : '–';
    };
    // SLA 칸: 눌러서 직접 고칠 수 있어요 (RM은 없음)
    const slaCell = rk => {
      if (!HO_SLA_HOURS[rk]) return el('td', { class:'ho-sla ho-sla-none', text:'–' });
      const f = `sla:${rk}`, td = el('td', { class:'ho-sla' });
      const show = () => {
        td.innerHTML = '';
        const v = d[f];
        const btn = el('button', { type:'button', class:'ho-sla-btn', title:'눌러서 SLA 고치기', 'aria-label': `${rk.toUpperCase()} SLA ${v ? slaText(v) : '비어 있음'}` });
        if (v) btn.append(el('b', { text: slaText(v) }), el('small', { class:'ho-sla-left', 'data-sla': v }));
        else btn.append(el('span', { class:'ho-sla-empty', text:'+' }));
        btn.onclick = edit;
        td.appendChild(btn);
        hoTickSla(td);
      };
      const edit = () => {
        td.innerHTML = '';
        const v = d[f] || '';
        const inp = el('input', { type:'datetime-local', class:'ho-sla-in', 'aria-label': `${rk.toUpperCase()} SLA`, value: v ? v.replace(' ', 'T') : '' });
        let done = false;
        const finish = () => {
          if (done) return; done = true;
          const nv = inp.value ? inp.value.replace('T', ' ').slice(0, 16) : '';
          if (nv !== v){ if (nv) d[f] = nv; else delete d[f]; hoSave('day', f, nv); }
          show();
        };
        inp.onblur = finish;
        inp.onchange = () => { if (matchMedia('(pointer:coarse)').matches) finish(); };
        inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); finish(); } else if (e.key === 'Escape'){ done = true; show(); } };
        td.appendChild(inp); inp.focus();
      };
      show();
      return td;
    };
    const src = d.nySrc;
    const nyBox = el('div', { class:'ho-sub ho-ny-box' }, el('div', { class:'ho-sub-head' }, el('h4', { text:'Backlog' }),
        el('button', { type:'button', class:'ho-shot ho-shot-sm', text:'캡쳐', title:'Backlog만 이미지로 저장', onclick: hoCaptureBacklog }),
        el('button', { type:'button', class:'ho-shot ho-shot-sm ho-imp-btn', text:'엑셀 올리기', title:'이관 목록 엑셀로 Backlog 자동 계산', onclick: hoPickExcel })),
      el('div', { class:'ho-table-wrap' }, el('table', { class:'ho-table ho-ny' },
        el('thead', {}, el('tr', {}, el('th', { scope:'col', text:'구분' }), ...HO_NY_COLS.map(([, l]) => el('th', { scope:'col', text:l })), el('th', { scope:'col', text:'합계' }), el('th', { scope:'col', text:'SLA' }))),
        el('tbody', {},
          ...HO_NY_ROWS.map(([rk, rl]) => el('tr', {}, el('th', { scope:'row', text: rl }), ...HO_NY_COLS.map(([ck, cl]) => {
            const f = `ny:${rk}:${ck}`;
            const n = el('input', { class:'ho-num', inputmode:'decimal', 'aria-label': `${rl} ${cl}`, maxlength: 8, value: d[f] ?? '' });
            n.onchange = () => { n.value = n.value.replace(/[^0-9.]/g, ''); if (n.value) d[f] = n.value; else delete d[f]; nyUpdate(); hoSave('day', f, n.value); };
            return el('td', {}, n);
          }), nySum[rk] = el('td', { class:'ho-ny-sum' }), slaCell(rk))),
          el('tr', { class:'ho-total' }, el('th', { scope:'row', text:'Total' }), el('td', { colspan: HO_NY_COLS.length }), nyTotalCell, el('td'))))),
      src && src.file ? el('div', { class:'ho-src', text:`엑셀에서 불러옴 · ${hoWhen(src.at)} · ${src.file}` }) : null);
    subs.appendChild(nyBox);
    // PC: 엑셀 파일을 Backlog 위로 끌어다 놓기
    nyBox.addEventListener('dragover', e => { e.preventDefault(); nyBox.classList.add('drop-on'); });
    nyBox.addEventListener('dragleave', () => nyBox.classList.remove('drop-on'));
    nyBox.addEventListener('drop', e => { e.preventDefault(); nyBox.classList.remove('drop-on'); const f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) hoImportFile(f); });
    nyUpdate();
    hoGridIndex(box);
    hoShade(box.querySelector('.ho-table'));
    box.querySelectorAll('textarea').forEach(hoFit);
  }

  // ---------- 인수인계: 챔버별 음영 ----------
  // 칸마다 표 안의 실제 열 위치를 계산해서 챔버를 찾고, 1C·3C·6C에 음영(머리글~합계까지), 챔버 사이에 굵은 선을 넣어요.
  function hoShade(table){
    if (!table) return;
    const chOfCol = [null, ...HO_COLS.map(([ck]) => hoCh(ck))];   // 0번 열은 분류
    const taken = [];
    const lastShade = [...table.rows].findIndex(tr => tr.classList.contains('ho-total'));
    [...table.rows].forEach((tr, r) => {
      let c = 0;
      for (const cellEl of tr.cells){
        while (taken[r] && taken[r][c]) c++;
        const span = cellEl.colSpan || 1, rs = cellEl.rowSpan || 1;
        for (let i = 0; i < rs; i++) for (let j = 0; j < span; j++) (taken[r + i] = taken[r + i] || [])[c + j] = true;
        const chs = new Set(chOfCol.slice(c, c + span));
        if (chs.size === 1 && !chs.has(null)){
          const ch = [...chs][0];
          if (ch % 2 === 1 && r <= lastShade) cellEl.classList.add('ch-alt');
          if (chOfCol[c - 1] !== ch) cellEl.classList.add('ch-first');
        } else if (c > 0) cellEl.classList.add('ch-first');
        c += span;
      }
    });
  }

  // ---------- 인수인계: 엔터 치면 아래 칸으로 ----------
  // 표마다 칸의 (줄, 열) 위치를 적어 두고, 엔터를 치면 같은 열의 아래 칸으로 옮겨요.
  // 열의 맨 아래면 다음 열의 맨 위로, 표의 끝이면 다음 표의 첫 칸으로 가요.
  function hoGridIndex(box){
    box.querySelectorAll('table').forEach((table, t) => {
      table.querySelectorAll('tbody tr').forEach((tr, r) => {
        let c = 0;
        for (const cellEl of tr.children){
          const f = cellEl.querySelector('input, textarea:not(.ho-memo)');   // 비고 메모는 엔터 이동에서 빼요
          if (f){ f.dataset.gt = t; f.dataset.gr = r; f.dataset.gc = c; f.dataset.gs = cellEl.colSpan || 1; f.setAttribute('enterkeyhint', 'next'); }
          c += cellEl.colSpan || 1;
        }
      });
    });
  }
  function hoNextCell(cur){
    const all = [...$('#ho').querySelectorAll('[data-gt]')].map(n => ({ n, t:+n.dataset.gt, r:+n.dataset.gr, c:+n.dataset.gc, s:+n.dataset.gs || 1 }));
    const me = { t:+cur.dataset.gt, r:+cur.dataset.gr, c:+cur.dataset.gc };
    const pick = list => list.sort((a, b) => a.c - b.c || a.r - b.r)[0];
    return pick(all.filter(x => x.t === me.t && x.r > me.r && x.c <= me.c && me.c < x.c + x.s))
        || pick(all.filter(x => x.t === me.t && x.c > me.c))
        || pick(all.filter(x => x.t > me.t).sort((a, b) => a.t - b.t).filter((x, _, arr) => x.t === arr[0].t));
  }
  $('#ho').addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    const cur = e.target.closest('[data-gt]');
    if (!cur) return;
    e.preventDefault();
    if (e.altKey && cur.tagName === 'TEXTAREA'){
      // Alt+Enter: 줄 바꾸기 (차량번호 여러 대 등) → 칸이 늘어나요
      cur.setRangeText('\n', cur.selectionStart, cur.selectionEnd, 'end');
      cur.dispatchEvent(new Event('input', { bubbles:true }));
      return;
    }
    const next = hoNextCell(cur);
    if (next){ next.n.focus(); if (next.n.select) next.n.select(); }
    else cur.blur();
  });

  // ---------- 인수인계 캡쳐 (기기와 상관없이 PC 폭 이미지로) ----------
  function hoWrap(ctx, text, maxW){
    const out = [];
    for (const para of String(text || '').split('\n')){
      let line = '';
      for (const ch of para){
        if (ctx.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
        else line += ch;
      }
      out.push(line);
    }
    while (out.length && !out[out.length - 1]) out.pop();
    return out;
  }

  async function hoCapture(){
    const a = document.activeElement;
    if (a && $('#ho').contains(a)) a.blur();             // 입력 중이던 칸 먼저 저장
    await new Promise(r => setTimeout(r, 50));
    const d = hoData.day;
    const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
    const C = { bg:'#ffffff', ink:'#1d2521', muted:'#6b746f', line:'#cfd6d2', head:'#eef2ef', acc:'#1f6f54', accSoft:'#e3f1ea' };
    // 칸 너비
    const widths = { label:110, pre:80, g:68, frozen:118 };
    const cols = HO_COLS.map(([ck]) => ck === 'pre' ? widths.pre : HO_FROZEN.includes(ck) ? widths.frozen : widths.g);
    const PAD = 36, W = PAD * 2 + widths.label + cols.reduce((x, y) => x + y, 0);
    const xs = []; { let x = PAD + widths.label; for (const w of cols){ xs.push(x); x += w; } }
    const LH = 18, ROW = 34;

    const m = document.createElement('canvas').getContext('2d');
    const setFont = (ctx, size, bold, mono) => ctx.font = `${bold ? 700 : 400} ${size}px ${mono ? 'ui-monospace,Menlo,Consolas,monospace' : FONT}`;
    // 줄 높이 미리 계산
    setFont(m, 13, false, true);
    const carLines = HO_FROZEN.map(ck => hoWrap(m, d[`car:${ck}`], widths.frozen - 12));
    const carH = Math.max(ROW, Math.max(...carLines.map(l => l.length)) * LH + 14);
    setFont(m, 13, false, true);
    const noteCells = []; { let i = 0; for (const [k, , span] of HO_NOTE){ let w = 0; for (let j = 0; j < span; j++) w += cols[i + j]; noteCells.push({ x: xs[i], w, lines: hoWrap(m, d[`note:${k}`], w - 12) }); i += span; } }
    const noteH = Math.max(ROW, Math.max(...noteCells.map(c => c.lines.length)) * LH + 14);
    const ppH = 26 + ROW * (HO_NY_ROWS.length + 2);   // 프리팩 표와 NYS·NYR 표 중 높은 쪽
    const TOP = 96, H1 = 34, H2 = 28;
    const tableH = H1 + H2 + ROW * (HO_ROWS.length + 1) + carH + noteH;
    const H = TOP + tableH + 24 + ppH + 44;

    const scale = 2;
    const cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'middle';

    const cell = (x, y, w, h, fill) => { if (fill){ ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); } ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w, h); };
    const text = (t, x, y, o = {}) => { setFont(ctx, o.size || 13, o.bold, o.mono); ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || 'center'; ctx.fillText(t, x, y); };

    // 제목
    text('GWJ3 IB', PAD, 30, { size:13, color:C.muted, align:'left' });
    text('인수인계', PAD, 58, { size:22, bold:true, align:'left' });
    text(hoDateOf().slice(0, 4) + '년 ' + longDate(hoDateOf()), W - PAD, 58, { size:17, bold:true, align:'right' });
    text('단위 PLT', W - PAD, 30, { size:12, color:C.muted, align:'right' });

    // 머리글 2줄
    let y = TOP;
    cell(PAD, y, widths.label, H1 + H2, C.head); text('분류', PAD + widths.label / 2, y + (H1 + H2) / 2, { bold:true });
    HO_COLS.forEach(([ck, label], i) => {
      const gm = /^c(\d)([gm])$/.exec(ck);
      if (!gm){ cell(xs[i], y, cols[i], H1 + H2, C.head); text(label, xs[i] + cols[i] / 2, y + (H1 + H2) / 2, { bold:true }); return; }
      if (gm[2] === 'g'){ cell(xs[i], y, cols[i] * 2, H1, C.head); text(gm[1] + 'C', xs[i] + cols[i], y + H1 / 2, { bold:true }); }
      cell(xs[i], y + H1, cols[i], H2, C.head); text(gm[2].toUpperCase(), xs[i] + cols[i] / 2, y + H1 + H2 / 2, { size:12, color:C.muted, bold:true });
    });
    y += H1 + H2;

    // 분류별 숫자 + 합계
    const sums = HO_COLS.map(() => ({ sum:0, any:false }));
    for (const [rk, rl] of HO_ROWS){
      cell(PAD, y, widths.label, ROW, C.head); text(rl, PAD + 10, y + ROW / 2, { bold:true, align:'left' });
      HO_COLS.forEach(([ck], i) => {
        cell(xs[i], y, cols[i], ROW);
        const v = d[`cell:${rk}:${ck}`];
        if (v !== undefined && v !== ''){ text(String(v), xs[i] + cols[i] / 2, y + ROW / 2, { mono:true, size:14 }); const n = parseFloat(v); if (!isNaN(n)){ sums[i].sum += n; sums[i].any = true; } }
      });
      y += ROW;
    }
    cell(PAD, y, widths.label, ROW, C.head); text('합계', PAD + 10, y + ROW / 2, { bold:true, align:'left' });
    HO_COLS.forEach((_, i) => { cell(xs[i], y, cols[i], ROW, C.accSoft); text(sums[i].any ? String(Math.round(sums[i].sum * 10) / 10) : '–', xs[i] + cols[i] / 2, y + ROW / 2, { mono:true, bold:true, size:14, color:C.acc }); });
    y += ROW;

    const yCar = y;
    // 냉동 챔버 차량번호
    cell(PAD, y, widths.label, carH, C.head); text('차량번호', PAD + 10, y + carH / 2, { bold:true, align:'left' });
    const fz = HO_COLS.findIndex(([ck]) => ck === HO_FROZEN[0]);
    cell(xs[0], y, xs[fz] - xs[0], carH, '#f6f8f7'); text('냉동 챔버(5C·6C·7C)', (xs[0] + xs[fz]) / 2, y + carH / 2, { size:12, color:C.muted });
    HO_FROZEN.forEach((ck, j) => {
      const i = HO_COLS.findIndex(c => c[0] === ck);
      cell(xs[i], y, cols[i], carH);
      carLines[j].forEach((ln, k) => text(ln, xs[i] + 6, y + 7 + LH / 2 + k * LH, { mono:true, size:13, align:'left' }));
    });
    y += carH;

    // 비고
    cell(PAD, y, widths.label, noteH, C.head); text('비고', PAD + 10, y + noteH / 2, { bold:true, align:'left' });
    noteCells.forEach(c => { cell(c.x, y, c.w, noteH); c.lines.forEach((ln, k) => text(ln, c.x + 6, y + 7 + LH / 2 + k * LH, { mono:true, size:13, align:'left' })); });
    // 챔버별 음영 (1C·3C·6C, 머리글~합계) + 챔버 사이 굵은 선
    const chX = HO_CH.map(ch => {
      const idx = HO_COLS.map(([ck], i) => [ck, i]).filter(([ck]) => HO_CH[hoCh(ck)] === ch).map(([, i]) => i);
      return { x: xs[idx[0]], w: idx.reduce((a, i) => a + cols[i], 0), frozen: HO_FROZEN.includes(ch) };
    });
    chX.forEach((c, k) => {
      if (k % 2 === 1){
        ctx.fillStyle = 'rgba(40,50,60,.09)';
        ctx.fillRect(c.x, TOP, c.w, yCar - TOP);                // 머리글 ~ 합계
      }
      if (k > 0){
        ctx.fillStyle = '#9FB3AB';
        ctx.fillRect(c.x - .5, TOP, 2, yCar - TOP);
        if (c.frozen) ctx.fillRect(c.x - .5, yCar, 2, carH);
        ctx.fillRect(c.x - .5, yCar + carH, 2, noteH);
      }
    });
    y += noteH + 24;

    // 프리팩
    text('프리팩', PAD, y + 10, { size:15, bold:true, align:'left' });
    y += 26;
    const PW = 90;
    cell(PAD, y, widths.label, ROW, C.head); text('품목', PAD + widths.label / 2, y + ROW / 2, { bold:true });
    cell(PAD, y + ROW, widths.label, ROW, C.head); text('수량', PAD + 10, y + ROW * 1.5, { bold:true, align:'left' });
    HO_PP.forEach(([k, l], i) => {
      const x = PAD + widths.label + i * PW;
      cell(x, y, PW, ROW, C.head); text(l, x + PW / 2, y + ROW / 2, { bold:true });
      cell(x, y + ROW, PW, ROW);
      const v = d[`ppq:${k}`];
      if (v) text(String(v), x + PW / 2, y + ROW * 1.5, { mono:true, size:14 });
    });

    // NYS·NYR (프리팩 오른쪽)
    {
      const NL = 80, NW = 90, SW = 110, nx = W - PAD - NL - NW * (HO_NY_COLS.length + 1) - SW, sx = W - PAD - SW;
      text('Backlog', nx, y - 16, { size:15, bold:true, align:'left' });
      cell(nx, y, NL, ROW, C.head); text('구분', nx + NL / 2, y + ROW / 2, { bold:true });
      [...HO_NY_COLS.map(([, l]) => l), '합계'].forEach((l, i) => { const x = nx + NL + i * NW; cell(x, y, NW, ROW, C.head); text(l, x + NW / 2, y + ROW / 2, { bold:true }); });
      cell(sx, y, SW, ROW, C.head); text('SLA', sx + SW / 2, y + ROW / 2, { bold:true });
      let total = 0, anyT = false;
      HO_NY_ROWS.forEach(([rk, rl], r) => {
        const yy = y + ROW * (r + 1);
        cell(nx, yy, NL, ROW, C.head); text(rl, nx + 10, yy + ROW / 2, { bold:true, align:'left' });
        let t = 0, any = false;
        HO_NY_COLS.forEach(([ck], i) => {
          const x = nx + NL + i * NW; cell(x, yy, NW, ROW);
          const v = d[`ny:${rk}:${ck}`];
          if (v !== undefined && v !== ''){ text(String(v), x + NW / 2, yy + ROW / 2, { mono:true, size:14 }); const n = parseFloat(v); if (!isNaN(n)){ t += n; any = true; } }
        });
        const x = nx + NL + HO_NY_COLS.length * NW; cell(x, yy, NW, ROW);
        text(any ? String(Math.round(t * 10) / 10) : '–', x + NW / 2, yy + ROW / 2, { mono:true, bold:true, size:14, color:C.muted });
        cell(sx, yy, SW, ROW);
        const sv = HO_SLA_HOURS[rk] ? slaText(d[`sla:${rk}`]) : '';
        text(sv || '–', sx + SW / 2, yy + ROW / 2, sv ? { mono:true, bold:true, size:14 } : { size:13, color:C.muted });
        if (any){ total += t; anyT = true; }
      });
      const yt = y + ROW * (HO_NY_ROWS.length + 1);
      cell(nx, yt, NL, ROW, C.head); text('Total', nx + 10, yt + ROW / 2, { bold:true, align:'left' });
      cell(nx + NL, yt, NW * HO_NY_COLS.length, ROW, C.accSoft);
      const xt = nx + NL + HO_NY_COLS.length * NW; cell(xt, yt, NW, ROW, C.accSoft);
      text(anyT ? String(Math.round(total * 10) / 10) : '–', xt + NW / 2, yt + ROW / 2, { mono:true, bold:true, size:14, color:C.acc });
      cell(sx, yt, SW, ROW, C.accSoft);
    }

    const now = new Date();
    text(`캡쳐 ${isoOf(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`, W - PAD, H - 20, { size:11, color:C.muted, align:'right' });

    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const name = `인수인계_${hoDateOf()}.png`;
    const file = new File([blob], name, { type:'image/png' });
    const mobile = matchMedia('(pointer:coarse)').matches;
    if (mobile) return hoShotView(cv.toDataURL('image/png'), blob, name);
    hoDownload(blob, name);
    toast('이미지를 저장했어요.');
  }

  // ---------- Backlog: 이관 목록 엑셀로 자동 계산 ----------
  // 파일은 이 브라우저 안에서만 읽어요. 서버에는 계산된 숫자, RC 차량 목록, 파일 이름만 저장돼요.
  // 규칙: 보내는 센터가 INC17·INC39·YON3일 때만 XD/RC — 이관계획 번호 없음 → XD / 있음 + RC 차량 → RC
  //       그 밖의 줄(다른 센터, RC가 아닌 차량)은 모두 RM
  //       상태 이동중 → NYR, 진열대기·진열중 → NYS (진열완료 등은 제외), 값은 집품수량 합계
  const hoWhen = iso => { const t = new Date(iso); return isNaN(t) ? '' : `${t.getMonth() + 1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}`; };
  const carKey = s => { const n = String(s || '').replace(/\D/g, ''); return n.length >= 4 ? n.slice(-4) : n; };   // 차량번호는 뒤 4자리로 비교
  const HO_XDRC_CENTERS = ['INC17', 'INC39', 'YON3'];   // XD·RC가 출발하는 센터 (띄어쓰기 무시)
  const isXdRcCenter = s => HO_XDRC_CENTERS.includes(String(s || '').replace(/\s/g, '').toUpperCase());
  const splitCars = s => String(s || '').split(/[\s,，/]+/).map(x => x.trim()).filter(Boolean);

  function hoPickExcel(){
    const inp = el('input', { type:'file', accept:'.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    inp.onchange = () => { if (inp.files[0]) hoImportFile(inp.files[0]); };
    inp.click();
  }

  // .xlsx(zip) 안의 첫 번째 시트를 줄 배열로 읽어요 (외부 라이브러리 없이)
  async function hoReadXlsx(file){
    const buf = new Uint8Array(await file.arrayBuffer());
    const dv = new DataView(buf.buffer);
    let e = buf.length - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('엑셀(.xlsx) 파일이 아니에요.');
    const count = dv.getUint16(e + 10, true);
    let p = dv.getUint32(e + 16, true);
    const files = {}, dec = new TextDecoder();
    for (let i = 0; i < count; i++){
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
      files[dec.decode(buf.subarray(p + 46, p + 46 + nl))] = { method, size, off };
      p += 46 + nl + xl + cl;
    }
    const read = async name => {
      const f = files[name];
      if (!f) return null;
      const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const data = buf.subarray(start, start + f.size);
      if (f.method === 0) return dec.decode(data);
      if (f.method !== 8 || typeof DecompressionStream === 'undefined') throw new Error('이 브라우저에서는 엑셀을 읽을 수 없어요. 크롬이나 최신 사파리로 열어 주세요.');
      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };
    const xml = s => new DOMParser().parseFromString(s, 'application/xml');
    // 첫 번째 시트 파일 찾기
    let sheetPath = null;
    try {
      const wb = xml(await read('xl/workbook.xml'));
      const rid = wb.getElementsByTagName('sheet')[0].getAttribute('r:id');
      const rels = xml(await read('xl/_rels/workbook.xml.rels'));
      for (const r of rels.getElementsByTagName('Relationship')) if (r.getAttribute('Id') === rid){ const t = r.getAttribute('Target'); sheetPath = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, ''); }
    } catch { /* 아래에서 대신 찾기 */ }
    if (!sheetPath || !files[sheetPath]) sheetPath = Object.keys(files).filter(n => /^xl\/worksheets\/[^/]+\.xml$/.test(n)).sort()[0];
    if (!sheetPath) throw new Error('엑셀 안에서 시트를 찾지 못했어요.');
    const ssx = await read('xl/sharedStrings.xml');
    const ss = ssx ? [...xml(ssx).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
    const doc = xml(await read(sheetPath));
    const colIdx = ref => { let n = 0; for (const ch of ref.replace(/\d+/g, '')) n = n * 26 + ch.charCodeAt(0) - 64; return n - 1; };
    const rows = [];
    for (const r of doc.getElementsByTagName('row')){
      const out = [];
      for (const c of r.getElementsByTagName('c')){
        const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
        let val = '';
        if (t === 's') val = ss[+(v && v.textContent)] ?? '';
        else if (t === 'inlineStr') val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
        else val = v ? v.textContent : '';
        out[colIdx(c.getAttribute('r') || '')] = val;
      }
      rows.push(out);
    }
    return rows;
  }

  // 줄 배열 → 계산에 필요한 줄만 추려 두기
  function hoPrepRows(rows){
    const norm = s => String(s || '').replace(/\s/g, '');
    const hi = rows.findIndex(r => r && r.some(v => norm(v) === '상태'));
    if (hi < 0) throw new Error("'상태' 열을 찾지 못했어요. 이관 목록(TransferOperationList) 엑셀인지 확인해 주세요.");
    const H = rows[hi].map(norm);
    const need = { plan:'이관계획번호', status:'상태', qty:'집품수량', car:'차량번호', from:'보내는센터' };
    const col = {};
    const miss = [];
    for (const [k, name] of Object.entries(need)){ col[k] = H.indexOf(name); if (col[k] < 0) miss.push(name); }
    if (miss.length) throw new Error('엑셀에 이 열이 없어요: ' + miss.join(', '));
    col.unload = H.indexOf('하차완료시간');   // SLA 계산용 (없으면 SLA는 비워 둬요)
    const items = [];
    let done = 0, other = 0;
    for (const r of rows.slice(hi + 1)){
      if (!r || !r.some(v => String(v || '').trim())) continue;
      const st = String(r[col.status] || '').trim();
      const kind = st === '이동중' ? 'nyr' : (st === '진열대기' || st === '진열중') ? 'nys' : null;
      if (!kind){ if (st === '진열완료') done++; else other++; continue; }
      const q = parseFloat(String(r[col.qty] || '').replace(/,/g, ''));
      items.push({ kind, plan: !!String(r[col.plan] || '').trim(), car: String(r[col.car] || '').trim(), main: isXdRcCenter(r[col.from]), qty: isNaN(q) ? 0 : q,
        unload: col.unload >= 0 ? slaDate(hoXlTime(r[col.unload])) : null });
    }
    return { total: rows.length - hi - 1, items, done, other };
  }

  // 엑셀 시간 칸: 글자('2026-09-25 15:48:48')나 엑셀 날짜 숫자 모두 받아요
  const hoXlTime = s => {
    const t = String(s || '').trim();
    if (/^\d+(\.\d+)?$/.test(t)){ const d = new Date(Math.round((parseFloat(t) - 25569) * 86400000)); return slaStr(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes())); }
    return t;
  };

  function hoCalc(prep, rcSet){
    const v = { xd:{ nys:0, nyr:0 }, rc:{ nys:0, nyr:0 }, rm:{ nys:0, nyr:0 } };
    const first = {};   // 줄마다 가장 이른 하차완료 시간 (NYS만)
    for (const it of prep.items){
      const row = !it.main ? 'rm' : !it.plan ? 'xd' : rcSet.has(carKey(it.car)) ? 'rc' : 'rm';
      v[row][it.kind] += it.qty;
      if (it.kind === 'nys' && it.unload && HO_SLA_HOURS[row] && (!first[row] || it.unload < first[row])) first[row] = it.unload;
    }
    for (const r in v) for (const k in v[r]) v[r][k] = Math.round(v[r][k] * 10) / 10;
    v.sla = {};
    for (const r in HO_SLA_HOURS) v.sla[r] = first[r] ? slaStr(new Date(first[r].getTime() + HO_SLA_HOURS[r] * 3600000)) : '';
    return v;
  }

  async function hoImportFile(file){
    if (!hoData) return;
    let prep;
    try {
      setSync('', '엑셀 읽는 중…');
      prep = hoPrepRows(await hoReadXlsx(file));
      setSync('', '');
    } catch(e) { toast(e.message || '엑셀을 읽지 못했어요.'); setSync('err', '엑셀을 읽지 못했어요'); return; }
    const d = hoData.day;
    // RC 후보: INC17·INC39·YON3에서 온, 이관계획 번호가 있는 차량 — 줄이 많은 순
    const carCount = new Map();
    for (const it of prep.items) if (it.main && it.plan && it.car){ const k = carKey(it.car); const c = carCount.get(k) || { label: it.car, n: 0 }; c.n++; carCount.set(k, c); }
    const cars = [...carCount.entries()].sort((a, b) => b[1].n - a[1].n);
    const rc = new Set(splitCars(d.rcCars).map(carKey).filter(Boolean));

    const close = () => { box.remove(); document.body.style.overflow = ''; };
    const chipBox = el('div', { class:'ho-imp-chips' });
    const extra = el('input', { class:'ho-in', placeholder:'목록에 없는 RC 차량 (쉼표로 구분)', 'aria-label':'RC 차량번호 직접 입력' });
    extra.value = [...rc].filter(k => !carCount.has(k)).join(', ');
    const tableBox = el('div');
    const cur = (rk, ck) => d[`ny:${rk}:${ck}`] ?? '';
    const fmt = n => String(Math.round(n * 10) / 10);
    let result = null;
    const rcAll = () => new Set([...rc, ...splitCars(extra.value).map(carKey).filter(Boolean)]);
    const refresh = () => {
      chipBox.innerHTML = '';
      if (!cars.length) chipBox.appendChild(el('p', { class:'ho-empty', text:'RC 후보 차량이 없어요.' }));
      for (const [k, c] of cars){
        const on = rc.has(k);
        chipBox.appendChild(el('button', { type:'button', class:'ho-chip' + (on ? ' on' : ''), 'aria-pressed': on ? 'true' : 'false',
          onclick: () => { on ? rc.delete(k) : rc.add(k); refresh(); } },
          el('span', { text: c.label }), el('small', { text: `${c.n}줄 · ${on ? 'RC' : 'RM'}` })));
      }
      result = hoCalc(prep, rcAll());
      let total = 0;
      tableBox.innerHTML = '';
      tableBox.appendChild(el('table', { class:'ho-table ho-ny ho-imp-table' },
        el('thead', {}, el('tr', {}, el('th', { text:'구분' }), ...HO_NY_COLS.map(([, l]) => el('th', { text:l })), el('th', { text:'합계' }), el('th', { text:'SLA' }))),
        el('tbody', {}, ...HO_NY_ROWS.map(([rk, rl]) => {
          const sum = result[rk].nys + result[rk].nyr; total += sum;
          return el('tr', {}, el('th', { text: rl }), ...HO_NY_COLS.map(([ck]) => {
            const nv = fmt(result[rk][ck]), ov = cur(rk, ck), changed = String(ov) !== nv;
            return el('td', { class: changed ? 'chg' : '' }, changed && ov !== '' ? el('span', { class:'old', text: ov }) : null, el('span', { text: nv }));
          }), el('td', { class:'ho-ny-sum', text: fmt(sum) }), (() => {
            if (!HO_SLA_HOURS[rk]) return el('td', { class:'ho-sla-none', text:'–' });
            const nv = result.sla[rk], ov = d[`sla:${rk}`] || '', changed = nv !== ov;
            return el('td', { class: changed ? 'chg' : '' }, changed && ov ? el('span', { class:'old', text: slaText(ov) }) : null, el('span', { text: nv ? slaText(nv) : '–' }));
          })());
        }), el('tr', { class:'ho-total' }, el('th', { text:'Total' }), el('td', { colspan: HO_NY_COLS.length }), el('td', { class:'ho-ny-total', text: fmt(total) }), el('td')))));
    };
    extra.oninput = refresh;

    const apply = el('button', { type:'button', class:'ho-shot-save', text:'적용하기' });
    apply.onclick = async () => {
      apply.disabled = true;
      const fields = {};
      for (const [rk] of HO_NY_ROWS) for (const [ck] of HO_NY_COLS) fields[`ny:${rk}:${ck}`] = fmt(result[rk][ck]);
      const labels = new Map(cars.map(([k, c]) => [k, c.label]));
      for (const rk in HO_SLA_HOURS) fields[`sla:${rk}`] = result.sla[rk];
      fields.rcCars = [...rcAll()].map(k => labels.get(k) || k).join(', ');
      fields.nySrc = { file: file.name.slice(0, 120), at: new Date().toISOString(), rows: String(prep.items.length) };
      try {
        const r = await api('PUT', '/api/handover', { fields });
        hoRev = r.rev;
        for (const [f, v] of Object.entries(fields)){ if (v === '' || v === null) delete d[f]; else d[f] = v; }
        close(); renderHandover(); setSync('', '저장됨'); toast('Backlog에 적용했어요.');
      } catch(e) {
        apply.disabled = false;
        if (e instanceof Locked){ close(); return showLock(e.message); }
        toast(e.message);
      }
    };

    const skipped = [prep.done ? `진열완료 ${prep.done}줄` : '', prep.other ? `기타 상태 ${prep.other}줄` : ''].filter(Boolean).join(', ');
    const box = el('div', { class:'ho-imp', role:'dialog', 'aria-label':'Backlog 계산' },
      el('div', { class:'ho-imp-panel' },
        el('h3', { text:'Backlog 계산' }),
        el('div', { class:'ho-imp-file' }, el('b', { text: file.name }),
          el('small', { text: `${prep.total}줄 읽음 · 계산 대상 ${prep.items.length}줄` + (skipped ? ` (${skipped} 제외)` : '') })),
        el('div', { class:'ho-imp-sec' },
          el('h4', { text:'RC 차량 고르기' }),
          el('p', { class:'ho-imp-help', text:'INC17·INC39·YON3에서 온 이관계획 차량이에요. RC 차량을 눌러 켜 주세요. 나머지 차량과 다른 센터에서 온 줄은 모두 RM으로 계산돼요.' }),
          chipBox, extra),
        el('div', { class:'ho-imp-sec' },
          el('h4', { text:'계산 결과 미리보기' }),
          el('p', { class:'ho-imp-help' }, el('span', { class:'chg', text:'빨간 숫자' }), document.createTextNode(' = 바뀌는 칸 (흐린 숫자는 지금 값) · 집품수량 합계 · SLA = 하차완료 + XD 12시간 / RC 18시간')),
          tableBox),
        el('div', { class:'ho-imp-acts' }, el('button', { type:'button', class:'ho-shot-close', text:'취소', onclick: close }), apply)));
    box.addEventListener('click', e => { if (e.target === box) close(); });
    refresh();
    document.body.style.overflow = 'hidden';
    document.body.appendChild(box);
  }

  // Backlog 표만 따로 캡쳐
  async function hoCaptureBacklog(){
    const a = document.activeElement;
    if (a && $('#ho').contains(a)) a.blur();
    await new Promise(r => setTimeout(r, 50));
    const d = hoData.day;
    const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
    const C = { bg:'#ffffff', ink:'#1d2521', muted:'#6b746f', line:'#cfd6d2', head:'#eef2ef', acc:'#1f6f54', accSoft:'#e3f1ea' };
    const PAD = 32, NL = 90, NW = 110, SW = 140, ROW = 38, TOP = 92;
    const W = PAD * 2 + NL + NW * (HO_NY_COLS.length + 1) + SW, sx = W - PAD - SW;
    const H = TOP + ROW * (HO_NY_ROWS.length + 2) + 44;
    const scale = 2, cv = document.createElement('canvas');
    cv.width = W * scale; cv.height = H * scale;
    const ctx = cv.getContext('2d'); ctx.scale(scale, scale);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H); ctx.textBaseline = 'middle';
    const setFont = (size, bold, mono) => ctx.font = `${bold ? 700 : 400} ${size}px ${mono ? 'ui-monospace,Menlo,Consolas,monospace' : FONT}`;
    const cell = (x, y, w, h, fill) => { if (fill){ ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); } ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w, h); };
    const text = (t, x, y, o = {}) => { setFont(o.size || 14, o.bold, o.mono); ctx.fillStyle = o.color || C.ink; ctx.textAlign = o.align || 'center'; ctx.fillText(t, x, y); };
    const round = n => String(Math.round(n * 10) / 10);

    text('GWJ3 IB · 인수인계', PAD, 28, { size:13, color:C.muted, align:'left' });
    text('Backlog', PAD, 58, { size:22, bold:true, align:'left' });
    text(hoDateOf().slice(0, 4) + '년 ' + longDate(hoDateOf()), W - PAD, 58, { size:15, bold:true, align:'right' });

    let y = TOP;
    cell(PAD, y, NL, ROW, C.head); text('구분', PAD + NL / 2, y + ROW / 2, { bold:true });
    [...HO_NY_COLS.map(([, l]) => l), '합계'].forEach((l, i) => { const x = PAD + NL + i * NW; cell(x, y, NW, ROW, C.head); text(l, x + NW / 2, y + ROW / 2, { bold:true }); });
    cell(sx, y, SW, ROW, C.head); text('SLA', sx + SW / 2, y + ROW / 2, { bold:true });
    let total = 0, anyT = false;
    HO_NY_ROWS.forEach(([rk, rl]) => {
      y += ROW;
      cell(PAD, y, NL, ROW, C.head); text(rl, PAD + 12, y + ROW / 2, { bold:true, align:'left' });
      let t = 0, any = false;
      HO_NY_COLS.forEach(([ck], i) => {
        const x = PAD + NL + i * NW; cell(x, y, NW, ROW);
        const v = d[`ny:${rk}:${ck}`];
        if (v !== undefined && v !== ''){ text(String(v), x + NW / 2, y + ROW / 2, { mono:true, size:15 }); const n = parseFloat(v); if (!isNaN(n)){ t += n; any = true; } }
      });
      const x = PAD + NL + HO_NY_COLS.length * NW; cell(x, y, NW, ROW);
      text(any ? round(t) : '–', x + NW / 2, y + ROW / 2, { mono:true, bold:true, size:15, color:C.muted });
      cell(sx, y, SW, ROW);
      const sv = HO_SLA_HOURS[rk] ? slaText(d[`sla:${rk}`]) : '';
      text(sv || '–', sx + SW / 2, y + ROW / 2, sv ? { mono:true, bold:true, size:15 } : { size:14, color:C.muted });
      if (any){ total += t; anyT = true; }
    });
    y += ROW;
    cell(PAD, y, NL, ROW, C.head); text('Total', PAD + 12, y + ROW / 2, { bold:true, align:'left' });
    cell(PAD + NL, y, NW * HO_NY_COLS.length, ROW, C.accSoft);
    const xt = PAD + NL + HO_NY_COLS.length * NW; cell(xt, y, NW, ROW, C.accSoft);
    text(anyT ? round(total) : '–', xt + NW / 2, y + ROW / 2, { mono:true, bold:true, size:15, color:C.acc });
    cell(sx, y, SW, ROW, C.accSoft);

    const now = new Date();
    text(`캡쳐 ${isoOf(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`, W - PAD, H - 18, { size:11, color:C.muted, align:'right' });

    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    const name = `Backlog_${hoDateOf()}.png`;
    if (matchMedia('(pointer:coarse)').matches) return hoShotView(cv.toDataURL('image/png'), blob, name);
    hoDownload(blob, name);
    toast('Backlog 이미지를 저장했어요.');
  }

  function hoDownload(blob, name){
    const url = URL.createObjectURL(blob);
    const link = el('a', { href:url, download:name });
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  // 휴대폰: 캡쳐 이미지를 띄우고 갤러리(사진)에 저장
  function hoShotView(dataUrl, blob, name){
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const close = () => { box.remove(); document.body.style.overflow = ''; };
    const save = el('button', { type:'button', class:'ho-shot-save', text: ios ? '사진에 저장' : '갤러리에 저장' });
    save.onclick = async () => {
      if (ios){
        // iPhone은 웹에서 바로 사진 앱에 넣을 수 없어 저장 창을 띄워요 → '이미지 저장'
        const file = new File([blob], name, { type:'image/png' });
        if (navigator.canShare && navigator.canShare({ files:[file] })){
          try { await navigator.share({ files:[file] }); } catch(e) {}
          return;
        }
      }
      hoDownload(blob, name);
      toast('저장했어요. 갤러리의 다운로드(Download) 앨범에서 볼 수 있어요.');
    };
    const box = el('div', { class:'ho-shot-view', role:'dialog', 'aria-label':'캡쳐 이미지' },
      el('div', { class:'ho-shot-bar' },

  function retSetMode(m){

    if (isNaN(+String(retForm.qty).replace(/,/g, ''))){ toast('수량은 숫자로 적어 주세요.'); $('#ret-qty').focus(); return; }
    const payload = {};
    for (const k of RET_FIELDS) payload[k] = k === 'qty' ? String(retForm.qty).replace(/,/g, '') : String(retForm[k] || '').trim();

      const cb = el('input', { type:'checkbox', 'aria-label':`${label} 전체 선택`, onchange: e => toggleSel(g.items, e.target.checked) });
      cb.checked = selN === n; cb.indeterminate = selN > 0 && selN < n;
      const old = Math.max(0, ...g.items.map(retOldDays));

      const toggle = () => { retUi.open.has(g.okey) ? retUi.open.delete(g.okey) : retUi.open.add(g.okey); retRenderList(); };
      const vN = new Set(g.items.map(t => t.vendor)).size;
      const ageText = byDateMode ? `업체 ${vN}곳` + (old ? ` · ${old}일째` : '') : (old ? `${retMD(g.items[0].date)}~ · ${old}일째` : retMD(g.items[0].date) + '~');
      return el('div', { class:'ret-group' + (open ? ' open' : '') + (selN ? ' has-sel' : '') },

        list.length ? el('span', { class:'ret-help', text: `${byDateMode ? '날짜' : '업체'} ${list.length}${byDateMode ? '일' : '곳'} · ${rows.length}건` }) : null,

  // ---- 회송 확인서 인쇄 (업체마다 A4 한 장) ----
  // 확인서가 A4 한 장을 넘으면 비율을 줄여서 무조건 한 장에 들어가게 해요
  function retFitPages(area){
    const mm = 96 / 25.4, W = 184 * mm, H = 268 * mm;   // A4(210×297) − 여백 12mm, 테두리가 잘리지 않게 조금 여유
    area.classList.add('measuring');
    for (const page of area.querySelectorAll('.rp-page')){
      const inner = page.firstElementChild;
      // 줄인 만큼 넓게 그려서 가로는 꽉 차게 — 한 장에 들어가는 가장 큰 비율을 찾아요
      const fits = k => { inner.style.zoom = k; inner.style.width = (W / k) + 'px'; return inner.getBoundingClientRect().height <= H; };
      let s = 1;
      if (!fits(1)){
        let lo = 0.2, hi = 1;
        for (let i = 0; i < 14; i++){ const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
        s = lo; fits(s);
      }
      page.dataset.scale = s.toFixed(3);
    }
    area.classList.remove('measuring');
  }

  function retPrint(list){
    if (!list.length) return;
    const groups = new Map();
    for (const t of list){ if (!groups.has(t.vendor)) groups.set(t.vendor, []); groups.get(t.vendor).push(t); }
    const now = new Date();
    const stamp = `${isoOf(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

          el('tbody', {}, ...items.map((t, i) => el('tr', {},
            el('td', { class:'c', text: i + 1 }), el('td', { class:'c', text: retMD(t.date) }), el('td', { text: t.po || '' }), el('td', { text: t.sku || '' }), el('td', { text: t.barcode || '' }),
            el('td', { text: t.name }), el('td', { text: t.reason }), el('td', { class:'c', text: retTemp(t.temp) }), el('td', { class:'r', text: retNum(t.qty) }))),
            el('tr', { class:'rp-sum' }, el('td', { colspan:'8', class:'r', text:'합계' }), el('td', { class:'r', text: retNum(qty) })))),
        el('div', { class:'rp-sign' }, el('div', { text:'인계자 (GWJ3)　　　　　　(서명)' }), el('div', { text:'인수자 (업체)　　　　　　(서명)' })),
        el('p', { class:'rp-foot', text: `GWJ3 IB · 출력 ${stamp}` })));
    }));
    document.querySelectorAll('#ret-print').forEach(n => n.remove());
    document.body.appendChild(area);
    retFitPages(area);
    const done = () => { area.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
  }

  // ---------- 생산성 (STOW 개인 UPH) ----------
  // WMS 작업자 이력(worker_history) 엑셀을 이 브라우저에서만 읽어요. 서버에는 아무것도 저장하지 않아요.
  const PR_TOTE = new Set(['11F', '21F', '31F']);        // 토트 재고이동 (챔버는 '프리팩')
  const PR_TYPES = ['PLT', 'CASE', 'EACH', 'TOTE'];

      el('p', { class:'pr-sub' }, '챔버별 진열', el('small', { text:'수량 기준 · 11F·21F·31F는 프리팩 · 오른쪽은 많이 진열한 로케이션' })),
      chL.length ? el('div', { class:'pr-chs' }, ...chL.map(([c, v]) => el('div', { class:'pr-cr' }, el('span', { class:'cn', text: c }),
        el('div', { class:'pr-track2' }, el('i', { style:`width:${v / cmax * 100}%` })), el('span', { class:'cq', text:`${prFmt(v)}개` }),
        el('span', { class:'cp', text:`${Math.round(v / ctot * 100)}%` }),
        el('span', { class:'cz', text: Object.entries(chz[c]).sort((a, b) => b[1] - a[1]).slice(0, 3).map(x => x[0]).join(' · ') }))))
        : el('p', { class:'ho-empty', text:'진열 기록이 없어요.' }));
  }

  // ---------- 이벤트 ----------
  $('#addForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#newText').value.trim();
    if (!v) { $('#newText').focus(); return; }
    const payload = {text:v, prio:$('#newPrio').value, due:$('#newDue').value};
    const temp = {...payload, id:'temp-'+Date.now(), done:false, createdAt:new Date().toISOString()};
    $('#newText').value=''; $('#newDue').value = view==='cal' ? selDate : '';
    if (filter==='done') filter='all';
    if (view==='cal' && payload.due && payload.due !== selDate){
      selDate = payload.due; const nd = new Date(payload.due+'T00:00:00'); calMonth = new Date(nd.getFullYear(), nd.getMonth(), 1);
    }
    mutate(() => { items.push(temp); }, async () => {
      const { item } = await api('POST', '/api/todos', payload);
      const i = items.findIndex(x => x.id === temp.id); if (i > -1) items[i] = item;
    });
    $('#newText').focus();
  });

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { filter = b.dataset.f; store.set('todo-filter', filter); render(); });
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    view = b.dataset.v; store.set('todo-view2', view);
    $('#newDue').value = view === 'cal' ? selDate : '';
    render();
    if (view === 'ho') loadHandover();
    if (view === 'ret') loadReturns();
  });
  function enterEdit(){ askEdit = false; editMode = true; render(); const el = $('#add-day'); if (el) el.focus(); }
  $('#editToggle').onclick = () => {
    if (editMode) { editMode = false; render(); return; }
    if (editKey) return enterEdit();
    askEdit = !askEdit; $('#editErr').textContent = ''; render();
    if (askEdit) $('#editPw').focus();
  };
  $('#editCancel').onclick = () => { askEdit = false; $('#editPw').value = ''; render(); };
  $('#editLock').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('#editPw').value.trim();
    if (!pw) return $('#editPw').focus();
    setEditKey(pw);
    try {
      await request('GET', '/api/shifts?verify=1');
      $('#editPw').value = ''; $('#editErr').textContent = '';
      enterEdit();
    } catch(err) {
      setEditKey('');
      if (err instanceof Locked) return showLock(err.message);
      $('#editErr').textContent = err.message; $('#editPw').select();
    }
  });
  function goMonth(delta){ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+delta, 1); render(); loadFull(); }
  $('#calPrev').onclick = () => goMonth(-1);
  $('#calNext').onclick = () => goMonth(1);
  $('#calToday').onclick = () => { selDate = todayIso; calMonth = new Date(now.getFullYear(), now.getMonth(), 1); $('#newDue').value = todayIso; render(); if (monthsNeeded() !== loadedMonths) loadFull(); };
  $('#clearDone').onclick = () => mutate(() => { items = items.filter(t=>!t.done); }, () => api('DELETE', '/api/todos?done=1'));

  $('#lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('#lockPw').value;
    if (!pw) return $('#lockPw').focus();
    teamKey = pw;
    try {
      await request('GET', '/api/state?only=rev');
      store.set('team-key', pw);
      $('#lock').hidden = true; $('#app').hidden = false; $('#lockPw').value = '';
      loadFull();
    } catch(err) {
      teamKey = ''; store.del('team-key');
      $('#lockErr').textContent = err instanceof Locked ? '비밀번호가 틀렸어요. 다시 입력하세요.' : err.message;
    }
  });

  if (view === 'cal') $('#newDue').value = selDate;
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  setInterval(poll, POLL_MS);
  render();
  loadFull();
})();
</script>
</body>
</html>
